  /* 폭주 불꽃: 말 SVG와 같은 좌표계(96x64)에서 등 위로 피어올라 뒤쪽으로 날리는 불길 */
  const tongue = (bx, by, w, h, cls, d) =>
    '<path class="' + cls + '" style="--d:' + d + 's" d="M' + (bx - w / 2) + ' ' + by +
    ' C' + (bx - w / 2) + ' ' + (by - h * 0.5) + ' ' + (bx - w * 0.3 - h * 0.25) + ' ' + (by - h * 0.72) + ' ' + (bx - h * 0.5) + ' ' + (by - h) +
    ' C' + (bx + w * 0.15) + ' ' + (by - h * 0.62) + ' ' + (bx + w / 2) + ' ' + (by - h * 0.45) + ' ' + (bx + w / 2) + ' ' + by + ' Z"/>';
  const flameSVG = () => {
    const spots = [[22, 34, 16, 26, -0.05], [34, 29, 16, 30, -0.11], [46, 28, 15, 27, 0], [57, 30, 13, 22, -0.08], [12, 40, 14, 18, -0.03]];
    let s = '<svg class="flame" viewBox="0 0 96 64" aria-hidden="true" focusable="false">';
    spots.forEach(([x, y, w, h, d]) => { s += tongue(x, y, w, h, 'f1', d); });
    spots.forEach(([x, y, w, h, d]) => { s += tongue(x + 1, y, w * 0.65, h * 0.68, 'f2', d - 0.04); });
    spots.forEach(([x, y, w, h, d]) => { s += tongue(x + 1.5, y, w * 0.35, h * 0.4, 'f3', d - 0.07); });
    return s + '</svg>';
  };

  /* ---------- 5. 참가자 목록 · 화면 상태 · 시상대 · 판독 사진 ---------- */
  const setMsg = t => { msgEl.textContent = t || ''; };
  const freeColor = () => {
    const used = players.map(p => p.color);
    return PALETTE.find(c => !used.includes(c)) || PALETTE[players.length % PALETTE.length];
  };
  const addPlayer = name => players.push({ id: nextId++, name, color: freeColor() });
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const numBall = (no, color) => {
    const b = document.createElement('span'); b.className = 'cno';
    b.style.background = color; b.style.color = textOn(color); b.textContent = no;
    return b;
  };

  function renderRoster() {
    rosterEl.textContent = '';
    if (!players.length) {
      const li = document.createElement('li'); li.className = 'roster-empty';
      li.textContent = '아직 참가자가 없어요. 이름을 추가하거나 경주마 추가를 눌러 보세요.';
      rosterEl.appendChild(li);
    }
    players.forEach((p, i) => {
      const li = document.createElement('li'); li.className = 'chip'; li.style.setProperty('--c', p.color);
      const nm = document.createElement('span'); nm.className = 'cname'; nm.textContent = p.name;
      const x = document.createElement('button'); x.type = 'button'; x.className = 'x'; x.textContent = '×';
      x.setAttribute('aria-label', p.name + ' 삭제'); x.disabled = racing || counting;
      x.addEventListener('click', () => removePlayer(p.id));
      li.append(numBall(i + 1, p.color), nm, x);
      rosterEl.appendChild(li);
    });
    countEl.textContent = '(' + players.length + ' / ' + MAX + '명)';
  }

  function updateHead() {
    badgeEl.textContent = '🏇 스릴 만점 ' + getDur() + '초 레이스';
    $('dist').textContent = (getDur() * 50).toLocaleString('en-US') + 'm';
  }

  function updateControls() {
    const busy = racing || counting;
    const full8 = players.length >= MAX;
    input.disabled = busy || full8;
    addBtn.disabled = busy || full8;
    input.placeholder = full8 ? '참가자 ' + MAX + '명이 모두 찼어요' : '이름을 입력하세요 (예: 홍길동)';
    resetBtn.disabled = busy;
    sampleBtn.disabled = busy || full8;
    durInputs.forEach(i => { i.disabled = busy; });
    ctaEl.hidden = busy || players.length === 0;
    stageEl.classList.toggle('idle', !busy && players.length > 0);
    startBtn.disabled = busy || players.length < MIN;
    dhBtn.disabled = busy;
    /* 다크호스 모드는 말이 4마리 이상일 때만 선택 가능 (폭주는 4위 이하 말 중에서 나옴) */
    dhBtn.hidden = players.length < 4;
    stageEl.classList.toggle('hasdh', !dhBtn.hidden);
    const showWin = !busy && hasRaced && finished.length > 0;
    stageEl.classList.toggle('done', showWin);
    winnerEl.hidden = !showWin;
    if (showWin) {
      podiumEl.textContent = '';
      const top = finished.slice(0, 3);
      podiumEl.classList.toggle('two', top.length === 2);
      top.forEach((p, k) => {
        const li = document.createElement('li'); li.className = 'p' + (k + 1);
        const nm = document.createElement('b'); nm.className = 'pname'; nm.textContent = p.name;
        nm.style.setProperty('--pc', p.color); nm.style.setProperty('--pt', textOn(p.color));
        const hs = document.createElement('div'); hs.className = 'horse phorse'; hs.style.color = p.color;
        hs.innerHTML = horseSVG(p.no);
        const st = document.createElement('span'); st.className = 'pstep'; st.textContent = k + 1;
        st.setAttribute('aria-label', (k + 1) + '위');
        li.append(nm, hs, st);
        podiumEl.appendChild(li);
      });
      fitWinner();
    }
    pfotoEl.hidden = !(showWin && finished.length >= 2);
    if (!pfotoEl.hidden) renderPhoto();
    startBtn.textContent = hasRaced ? '🏁 다시 시작' : '🏁 시작';
  }

  /* 결승 판독 사진: 1위가 결승선에 코를 댄 순간, 2위가 얼마나 뒤에 있었는지 */
  function renderPhoto() {
    const a = finished[0], b = finished[1];
    const dt = Math.max(0, b.time - a.time);
    let L = 0;
    if (pfSnap && pfSnap.hw > 0) {
      L = (1 - pfSnap.pos[b.no - 1]) * pfSnap.track / pfSnap.hw;
      if (!(L > 0.01)) L = dt / a.time * pfSnap.track / pfSnap.hw;
    }
    const HW = 64, off = Math.min(L * HW, 150);
    pfotoEl.textContent = '';
    const head = document.createElement('div'); head.className = 'pfhead';
    const ti = document.createElement('span'); ti.className = 'pftitle'; ti.textContent = '📸 PHOTO FINISH';
    const mg = document.createElement('span'); mg.className = 'pfmargin';
    mg.textContent = dt.toFixed(2) + '초 차';
    head.append(ti, mg);
    const img = document.createElement('div'); img.className = 'pfimg';
    const line = document.createElement('span'); line.className = 'pfline';
    img.appendChild(line);
    [a, b].forEach((p, k) => {
      const lane = document.createElement('div'); lane.className = 'pflane';
      const rk = document.createElement('span'); rk.className = 'pfrk'; rk.textContent = k + 1;
      const run = document.createElement('div'); run.className = 'pfrun';
      run.style.setProperty('--off', (k ? off : 0).toFixed(1) + 'px');
      const tag = document.createElement('span'); tag.className = 'pftag'; tag.textContent = p.name;
      tag.style.background = p.color; tag.style.color = textOn(p.color);
      const hs = document.createElement('div'); hs.className = 'horse pfh'; hs.style.color = p.color;
      hs.style.setProperty('--ph', (k ? 0.3 : 0.12) + 's');
      hs.innerHTML = horseSVG(p.no);
      run.append(tag, hs);
      const tm = document.createElement('span'); tm.className = 'pftime'; tm.textContent = p.time.toFixed(2) + '초';
      lane.append(rk, run, tm);
      img.appendChild(lane);
    });
    pfotoEl.append(head, img);
  }

  /* 이름이 길면 시상대 칸 안에 한 줄로 들어오도록 글자 크기를 줄임 (화면 크기가 바뀔 때마다 다시 계산) */
  function fitWinner() {
    if (winnerEl.hidden) return;
    podiumEl.querySelectorAll('.pname').forEach(el => {
      el.style.fontSize = '';
      let fs = parseFloat(getComputedStyle(el).fontSize) || 17;
      while (el.scrollWidth > el.clientWidth && fs > 9) { fs -= 1; el.style.fontSize = fs + 'px'; }
    });
  }

  /* 맨 앞 아이콘과 본문을 따로 두어, 줄이 바뀌어도 둘째 줄이 본문 첫 글자에 맞춰 정렬됨 */
  function putStatus(str) {
    const m = str.match(/^(\S+)\s+([\s\S]*)$/);
    const icon = m ? m[1] : '', tx = m ? m[2] : str;
    stiEl.textContent = icon; sttEl.textContent = tx; statusEl.title = tx;
  }

  function setStatus() {
    let s, st, label;
    if (counting) { s = '🎙️ 말들이 게이트에 들어섭니다!'; st = 'wait'; label = '대기 중'; }
    else if (racing) { s = '🏇 경주 중! 누가 먼저 들어올까?'; st = 'run'; label = '진행 중'; }
    else if (hasRaced && finished.length) {
      const w = finished[0];
      s = (midName && midName !== w.name) ? '🎊 짜릿한 역전승입니다! 우승 ' + w.name + '!' : '🏆 결승선 통과! 우승은 ' + w.name + '입니다!';
      st = 'done'; label = '경주 완료';
    }
    else { s = players.length < MIN ? '⏳ 참가자를 기다리는 중' : '🚦 ' + players.length + '명 출전 대기'; st = 'wait'; label = '대기 중'; }
    putStatus(s);
    stateEl.textContent = label; stateEl.className = 'state ' + st;
    liveEl.classList.toggle('on', racing);
    arenaEl.classList.toggle('cheer', racing);
  }

  /* ---------- 6. 경주로 배치 · 전체화면 · 화면 켜짐 유지 ---------- */
  function measure() {
    const lane = lanesEl.querySelector('.lane');
    if (!lane) { laneW = 0; hw = 0; return; }
    laneW = lane.clientWidth;
    hw = horseEls[0].offsetWidth;
    tagW = tagEls.map(t => t.offsetWidth);
    geo = horseEls.map((h, i) => ({ ox: laneEls[i].offsetLeft, oy: laneEls[i].offsetTop + h.offsetTop, hh: h.offsetHeight }));
    sizeFx();
  }

  function applyPos(t) {
    for (let i = 0; i < horseEls.length; i++) {
      const x = pos[i] * (laneW - hw);
      let amp = 1.3;
      if (doneAt[i] != null) amp *= Math.max(0, 1 - (t - doneAt[i]) / 0.5);
      const bob = racing && laneEls[i].classList.contains('running') ? Math.sin(t * 22 + i * 1.7) * amp : 0;
      horseEls[i].style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + bob.toFixed(2) + 'px,0)';
      /* 이름표는 말 몸통 위가 아니라 꼬리 쪽(진행 방향 뒤)에 배치합니다.
         출발 직후에는 뒤쪽 공간이 부족하므로 반대편으로 잠시 피하고,
         공간이 생기면 다시 꼬리 쪽으로 이동합니다. */
      const gap = Math.max(6, Math.round(hw * 0.08));
      const behindX = x - tagW[i] - gap;
      const aheadX = x + hw + gap;
      const tx = behindX >= 0
        ? behindX
        : clamp(aheadX, 0, Math.max(0, laneW - tagW[i]));
      tagEls[i].style.transform = 'translate3d(' + tx.toFixed(1) + 'px,0,0)';
    }
  }

  /* 경주 전(전체화면이 아닐 때) 경주장 높이 상한: 폰 336px, 태블릿·PC 420px.
     4마리까지는 원래 크기 그대로, 그보다 많으면 상한 안에 들어가도록 레인 높이와 말·이름표를 함께 줄임 */
  const IDLE_VARS = ['--lh', '--hw', '--th'];
  function fitIdle() {
    if (isFull || !players.length) { IDLE_VARS.forEach(v => lanesEl.style.removeProperty(v)); return; }
    const big = window.innerWidth >= 560;
    const baseLh = big ? 88 : 70, baseHw = big ? 88 : 62, baseTh = big ? 22 : 20, maxH = big ? 420 : 336;
    const lh = Math.min(baseLh, Math.floor(maxH / players.length));
    if (lh >= baseLh) { IDLE_VARS.forEach(v => lanesEl.style.removeProperty(v)); return; }
    lanesEl.style.setProperty('--lh', lh + 'px');
    lanesEl.style.setProperty('--hw', Math.round(baseHw * lh / baseLh) + 'px');
    lanesEl.style.setProperty('--th', clamp(Math.round(lh * 0.45), 16, baseTh) + 'px');
  }

  function buildLanes() {
    clearFx(); resetCam();
    lanesEl.textContent = '';
    fxCanvas = null; fxCtx = null; geo = []; ghostImg = [];
    laneEls = []; horseEls = []; tagEls = []; badgeEls = []; finRank = [];
    if (players.length === 0) {
      const e = document.createElement('div'); e.className = 'lanes-empty';
      e.textContent = '참가자를 추가하면 출발선에 말이 섭니다.';
      lanesEl.appendChild(e);
      pos = []; doneAt = []; laneW = 0; hw = 0;
      return;
    }
    players.forEach((p, i) => {
      const lane = document.createElement('div'); lane.className = 'lane';
      const badge = document.createElement('span'); badge.className = 'numbadge';
      badge.style.background = p.color; badge.style.color = textOn(p.color); badge.textContent = i + 1;
      const tag = document.createElement('div'); tag.className = 'tag';
      tag.style.background = p.color; tag.style.color = textOn(p.color);
      const nm = document.createElement('span'); nm.textContent = p.name; tag.appendChild(nm);
      const rkEl = document.createElement('b'); rkEl.className = 'rk'; rkEl.textContent = '1위'; tag.appendChild(rkEl);
      const horse = document.createElement('div'); horse.className = 'horse'; horse.style.color = p.color;
      horse.innerHTML = flameSVG() + horseSVG(i + 1);
      lane.append(badge, tag, horse);
      lanesEl.appendChild(lane);
      laneEls.push(lane); horseEls.push(horse); tagEls.push(tag); badgeEls.push(badge);
    });
    fxCanvas = document.createElement('canvas'); fxCanvas.className = 'fx'; fxCanvas.setAttribute('aria-hidden', 'true');
    lanesEl.insertBefore(fxCanvas, lanesEl.firstChild);
    pos = players.map(() => 0);
    doneAt = players.map(() => null);
    finRank = players.map(() => null);
    fitIdle();
    measure();
    applyPos(0);
  }

  /* 전체 화면 모드: 시작하면 LIVE+경주로를 화면 가득, 끝나면 원래 크기 */
  let isFull = false;
  let celebTimer = 0;
  /* 큰 PC 모니터 판별: 마우스(정밀 포인터+호버)를 쓰고 화면 너비 1280px·높이 800px 이상.
     터치 기기(스마트폰·태블릿)는 해당하지 않으므로 기존 동작 그대로 */
  const isBigScreen = () => {
    try {
      return matchMedia('(hover: hover) and (pointer: fine)').matches &&
        window.innerWidth >= 1280 && window.innerHeight >= 800;
    } catch (e) { return false; }
  };
  /* 세로 화면이면 경주장을 시계방향 90도 회전해 가로 모드처럼 보여줌.
     폰을 실제로 가로로 돌리면 회전을 풀고 그대로 가로 화면을 사용 */
  /* 폰을 어느 쪽으로 눕혔는지 중력 센서로 판별 (화면 회전 잠금이 켜져 있어도 동작).
     폰 위쪽이 왼쪽으로 가게 눕히면(반시계) 경주장을 시계방향 90도, 오른쪽으로 눕히면(시계) 반시계방향 90도로 돌림.
     센서 값이 없으면 지금처럼 시계방향 90도. 아이폰은 센서 부호가 반대라서 똑바로 세웠을 때의 값으로 보정함 */
  let tiltDir = 1, gSign = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) ? -1 : 1, gCal = false;
  window.addEventListener('devicemotion', e => {
    const g = e.accelerationIncludingGravity;
    if (!g || g.x == null || g.y == null) return;
    /* 폰을 똑바로 세운 상태(세로 화면)라면 y가 +가 되어야 함: 반대면 부호를 뒤집어 씀 */
    if (!gCal && Math.abs(g.y) > 6 && Math.abs(g.y) > Math.abs(g.x) * 2 && window.innerHeight > window.innerWidth) { gSign = g.y > 0 ? 1 : -1; gCal = true; }
    const x = g.x * gSign;
    if (Math.abs(x) < 6 || Math.abs(x) < Math.abs(g.y)) return; /* 충분히 눕혔을 때만 바꿈 */
    const dir = x > 0 ? 1 : -1;
    if (dir !== tiltDir) { tiltDir = dir; if (isFull) fitRot(); }
  });
  /* 아이폰은 센서 사용 허락을 버튼을 누른 순간에 받아야 함 */
  function askMotion() {
    try {
      if (window.DeviceMotionEvent && typeof DeviceMotionEvent.requestPermission === 'function') DeviceMotionEvent.requestPermission().catch(() => {});
    } catch (e) { /* 미지원이면 시계방향 고정 */ }
  }
  function fitRot() {
    if (!isFull) return;
    const W = window.innerWidth, H = window.innerHeight;
    const rot = H > W;
    arenaEl.classList.toggle('rot', rot);
    arenaEl.classList.toggle('ccw', rot && tiltDir < 0);
    if (rot) {
      arenaEl.style.width = H + 'px';
      arenaEl.style.height = W + 'px';
      /* 회전 축(상자 가운데)이 화면 가운데와 겹치도록 배치 */
      arenaEl.style.left = (W - H) / 2 + 'px';
      arenaEl.style.top = (H - W) / 2 + 'px';
    } else {
      ['width', 'height', 'left', 'top'].forEach(v => arenaEl.style.removeProperty(v));
    }
    /* 회전했거나 실제 가로 화면이면 가로용 압축 배치 사용 */
    const landscape = rot || W > H;
    arenaEl.classList.toggle('landscape', landscape);
    arenaEl.classList.toggle('big', isBigScreen() && !rot);
    arenaEl.classList.toggle('wide', landscape || players.length <= 4);
    /* 배경 띠 높이: 경주장 높이의 약 11% */
    const ah = rot ? W : H;
    arenaEl.style.setProperty('--scn', clamp(Math.round(ah * 0.13), 30, 130) + 'px');
  }
  function fitLanes() {
    if (!isFull || !players.length) return;
    const landscape = arenaEl.classList.contains('landscape');
    if (landscape) {
      /* 참가 인원에 따라 레인 높이를 재계산합니다.
         적은 인원은 말을 크게, 8명은 화면 안에 모두 들어오도록 자동 축소합니다. */
      const available = Math.max(160, stageEl.clientHeight - 8);
      if (arenaEl.classList.contains('big')) {
        /* 큰 PC 모니터: 레인이 경주장 높이를 위아래 꽉 채우도록 나누고, 말은 너무 커지지 않게 상한을 둠 */
        const lh = Math.max(60, Math.floor(available / players.length));
        arenaEl.style.setProperty('--lh', lh + 'px');
        arenaEl.style.setProperty('--hw', clamp(lh * 1.0, 70, 240) + 'px');
        arenaEl.style.setProperty('--th', clamp(lh * 0.22, 22, 40) + 'px');
        return;
      }
      const lh = clamp(Math.floor(available / players.length), 22, 104);
      arenaEl.style.setProperty('--lh', lh + 'px');
      arenaEl.style.setProperty('--hw', clamp(lh * 1.18, 26, 116) + 'px');
      arenaEl.style.setProperty('--th', clamp(lh * 0.56, 13, 30) + 'px');
      return;
    }
    /* 세로 화면에서도 참가 인원에 맞춰 말 크기를 자동 조절합니다. */
    const inner = Math.max(180, stageEl.clientHeight - 12);
    const lh = clamp(Math.floor(inner / players.length), 48, 170);
    arenaEl.style.setProperty('--lh', lh + 'px');
    arenaEl.style.setProperty('--hw', clamp(lh * 1.08, 48, 184) + 'px');
    arenaEl.style.setProperty('--th', clamp(lh * 0.24, 22, 30) + 'px');
  }
  function enterFull() {
    if (isFull) return;
    slotEl.style.height = arenaEl.offsetHeight + 'px';
    isFull = true;
    arenaEl.classList.add('full');
    document.body.classList.add('fullrace');
    /* 첫 배치가 끝난 뒤부터 방향 전환 애니메이션 사용 */
    requestAnimationFrame(() => requestAnimationFrame(() => { if (isFull) arenaEl.classList.add('rotanim'); }));
    fitIdle(); /* 전체화면에서는 경주장 크기 조절(fitLanes)이 대신 맡음 */
    /* 회전된 요소는 전체화면 대상이 될 수 없으므로 문서 전체를 전체화면으로 (막히면 화면 가득 채우기만 적용) */
    try {
      const de = document.documentElement;
      if (de.requestFullscreen) de.requestFullscreen().catch(() => {});
    } catch (e) { /* 전체화면 API 미지원 */ }
    fitRot();
    fitLanes();
  }
  /* 화면 켜짐 유지(Wake Lock): 경주 시작부터 시상식이 끝날 때까지만 화면이 어두워지거나 잠기지 않게 함.
     다른 앱으로 갔다 돌아오면 경주 중일 때만 다시 켬. 지원하지 않는 브라우저에서는 아무 일도 하지 않음 */
  let wakeLock = null, wakeWanted = false;
  async function keepAwake() {
    wakeWanted = true;
    try {
      if (!('wakeLock' in navigator) || wakeLock) return;
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } catch (e) { wakeLock = null; /* 거부되거나 미지원이면 무시 */ }
  }
  function allowSleep() {
    wakeWanted = false;
    const w = wakeLock; wakeLock = null;
    if (w) { try { w.release().catch(() => {}); } catch (e) { /* 무시 */ } }
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && wakeWanted) keepAwake();
  });

  function exitFull() {
    if (!isFull) return;
    isFull = false;
    allowSleep();
    clearTimeout(celebTimer);
    arenaEl.classList.remove('full', 'wide', 'landscape', 'rot', 'ccw', 'rotanim', 'big', 'cheer');
    document.body.classList.remove('fullrace');
    ['--lh', '--hw', '--th', '--scn', 'width', 'height', 'left', 'top'].forEach(v => arenaEl.style.removeProperty(v));
    slotEl.style.height = '';
    /* 줄어든 경주장 박스를 브라우저 화면 세로 중간에 맞춤 (전체화면 해제가 끝난 뒤 한 번 더) */
    const center = () => { try { arenaEl.scrollIntoView({ block: 'center', inline: 'nearest' }); } catch (e) { /* 무시 */ } };
    requestAnimationFrame(() => { fitWinner(); center(); });
    fitIdle();
    setTimeout(() => { fitWinner(); fitIdle(); measure(); applyPos(lastT); center(); }, 300);
    try { if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {}); } catch (e) { /* 무시 */ }
  }

  /* ---------- 7. 중계 멘트 · 순위 · 경주 진행 ---------- */
  /* 경마장 아나운서 멘트: 선두 진행도와 선두 교체에 맞춰 LIVE 바에 표시 */
  let cm = { text: '', t: -9, phase: -1, lead: -1, k: 0 }, midName = null;
  const iga = n => { const c = n.charCodeAt(n.length - 1); return (c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28 !== 0) ? '이' : '가'; };
  const LINES = [
    [() => '출발했습니다! 일제히 박차고 나갑니다!', n => n + ', 좋은 스타트로 앞서 나갑니다!'],
    [n => n + iga(n) + ' 선두, 그 뒤를 바짝 쫓고 있습니다!', () => '안쪽에서 치고 올라옵니다!'],
    [() => '마지막 직선 코스! 승부가 갈립니다!', n => n + iga(n) + ' 선두, 그 뒤를 바짝 쫓고 있습니다!'],
    [() => '결승선이 코앞입니다! 누가 먼저 들어올까요!', () => '마지막 직선 코스! 승부가 갈립니다!']
  ];
  function commentary(t) {
    if (!players.length) return;
    let lead = 0;
    const fin = finRank.map((r, i) => r != null ? i : -1).filter(i => i >= 0).sort((a, b) => finRank[a] - finRank[b]);
    if (fin.length) lead = fin[0];
    else for (let i = 1; i < pos.length; i++) if (pos[i] > pos[lead]) lead = i;
    const u = pos[lead];
    const phase = u < 0.15 ? 0 : u < 0.6 ? 1 : u < 0.85 ? 2 : 3;
    const n = players[lead].name;
    if (phase >= 2 && midName === null) midName = n;
    /* 폭주 중계 멘트는 잠시 유지 */
    if (cm.hold && t < cm.hold) { cm.lead = lead; cm.phase = phase; return; }
    const changed = cm.lead >= 0 && lead !== cm.lead && u > 0.15 && u < 0.95;
    let text = null;
    if (changed) {
      if (t - cm.t >= 0.8) text = phase >= 2 ? n + ', 막판 스퍼트! 선두가 바뀝니다!' : '순위가 뒤집힙니다! 아직 아무도 몰라요!';
    } else if (phase !== cm.phase || t - cm.t >= 1.8) {
      const L = LINES[phase]; text = L[cm.k++ % L.length](n);
    }
    cm.lead = lead; cm.phase = phase;
    if (text && text !== cm.text) {
      cm.text = text; cm.t = t;
      putStatus('🎙️ ' + text);
    }
  }

  function resetRace() {
    cancelAnimationFrame(raf);
    allowSleep();
    clearTimeout(celebTimer);
    musicStop();
    stopConfetti();
    resetScenery();
    racing = false; hasRaced = false; finished = []; lastT = 0;
    resultsEl.textContent = '';
    emptyEl.hidden = false;
    clockEl.textContent = '0.0초';
    buildLanes();
    updateControls();
    setStatus();
  }

  function addResult(rank, p, time, no) {
    const li = document.createElement('li'); li.className = 'res r' + Math.min(rank, 4);
    const rk = document.createElement('span'); rk.className = 'rankpill';
    rk.textContent = (MEDAL[rank - 1] ? MEDAL[rank - 1] + ' ' : '') + rank + '위';
    const nm = document.createElement('span'); nm.className = 'rname'; nm.textContent = p.name;
    const tm = document.createElement('span'); tm.className = 'rtime';
    const tt = document.createElement('span'); tt.textContent = time.toFixed(2) + '초';
    tm.appendChild(tt);
    if (rank > 1 && finished[0]) {
      const gp = document.createElement('span'); gp.className = 'rgap';
      gp.textContent = '+' + (time - finished[0].time).toFixed(2) + '초';
      tm.appendChild(gp);
    }
    li.append(rk, numBall(no, p.color), nm, tm);
    resultsEl.appendChild(li);
    emptyEl.hidden = true;
  }

  function finishHorse(i, T) {
    const rank = finished.length + 1;
    finished.push({ name: players[i].name, color: players[i].color, time: T, no: i + 1 });
    doneAt[i] = lastT;
    finRank[i] = rank;
    try { horseEls[i].getAnimations({ subtree: true }).forEach(a => { a.playbackRate = 0.35; }); } catch (e) { /* 미지원 브라우저는 그대로 */ }
    tagEls[i].classList.add('done');
    if (rank === 1) tagEls[i].classList.add('first');
    tagW[i] = tagEls[i].offsetWidth;
    addResult(rank, players[i], T, i + 1);
    sfx.cross(rank);
  }

  /* 경주가 끝나면 다리 움직임을 서서히 늦춰 멈춤 */
  function settleLegs() {
    let anims = [];
    try { anims = horseEls.flatMap(h => h.getAnimations({ subtree: true })); } catch (e) { return; }
    let r = 0.35;
    const slow = () => {
      r *= 0.9;
      if (r > 0.02) { anims.forEach(a => { a.playbackRate = r; }); requestAnimationFrame(slow); }
      else anims.forEach(a => a.pause());
    };
    slow();
  }

  /* 말 뒤쪽 번호판: 경주 중에는 현재 순위, 결승선을 지난 말은 확정 순위 */
  function updateRanks() {
    /* 동률이면 같은 순위: 출발 전 카운트다운 동안에는 모든 말이 1위 */
    const finCount = finRank.filter(r => r != null).length;
    const rankOf = i => finRank[i] != null
      ? finRank[i]
      : finCount + 1 + pos.filter((v, j) => finRank[j] == null && v > pos[i]).length;
    pos.forEach((_, i) => {
      const r = rankOf(i), t = String(r);
      const el = badgeEls[i];
      if (el && el.textContent !== t) {
        el.textContent = t;
        el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
      }
      const rk = tagEls[i] && tagEls[i].querySelector('.rk');
      if (rk && rk.textContent !== t + '위') { rk.textContent = t + '위'; tagW[i] = tagEls[i].offsetWidth; }
    });
  }

  function runRace() {
    if (racing || players.length < MIN) return;
    setMsg('');
    finished = []; pfSnap = null;
    resultsEl.textContent = '';
    emptyEl.hidden = false;
    buildLanes();
    sfx.start();

    const n = players.length;
    const order = shuffle([...Array(n).keys()]);
    const step = Math.min(0.17, 1.2 / n);
    const k = getDur() / 10;
    const race = players.map((p, i) => ({
      T: (9.6 + order[i] * step + Math.random() * step * 0.35) * k,
      waves: [
        { a: 0.035, f: 1 + Math.random(), ph: Math.random() * 6.283 },
        { a: 0.020, f: 2 + Math.random(), ph: Math.random() * 6.283 },
        { a: 0.010, f: 3 + Math.random(), ph: Math.random() * 6.283 }
      ],
      c: 0, fin: 0, last: 0, done: false
    }));
    const maxT = Math.max(...race.map(r => r.T));
    /* 폭주(다크호스): 경주 거리별로 500m 1마리, 750m 2마리, 1,000m 3마리. 단 '말 수 − 3'마리를 넘지 않음
       (예: 4마리면 1마리, 5마리면 최대 2마리). 그래서 폭주할 때마다 후보가 반드시 한 마리 이상 남음.
       선두가 50~75% 구간의 무작위 지점들을 지날 때마다, 그 순간 1~3위가 아니고 아직 폭주하지 않은 말 중 하나가
       경주 길이별 시간(500m 1.5초, 750m 2.3초, 1,000m 3초) 동안 1.2배 속도로 달림. 참가자가 4명 이상일 때만 발생 */
    const BOOST_MUL = 1.2, BOOST_SEC = ({ 10: 1.5, 15: 2.3, 20: 3 })[getDur()] || 1.5;
    const BOOST_N = darkHorse && n >= 4 ? Math.min(n - 3, ({ 10: 1, 15: 2, 20: 3 })[getDur()] || 1) : 0;
    const boostAts = Array.from({ length: BOOST_N }, (_, k) => 0.5 + (k + Math.random()) * (0.25 / BOOST_N));
    const boosts = [];
    const boostOf = i => boosts.find(b => b.i === i);
    const setBoostFx = (i, on) => {
      horseEls[i].classList.toggle('boost', on);
      if (on && !ghostImg[i]) ghostImg[i] = makeGhost(players[i].color, i + 1);
      try { horseEls[i].getAnimations({ subtree: true }).forEach(a => { if (!race[i].done) a.playbackRate = on ? BOOST_MUL : 1; }); } catch (e) { /* 미지원 브라우저는 그대로 */ }
    };
    musicStart(maxT + 2); /* 막판 슬로모션만큼 여유 */

    cm = { text: '', t: -9, phase: -1, lead: -1, k: 0 }; midName = null;
    racing = true; hasRaced = true;
    renderRoster(); updateControls(); setStatus();
    laneEls.forEach(l => l.classList.add('running'));

    /* 막판 슬로모션과 줌: 선두가 결승선 직전(95%)에 오면 경주 시간이 0.4배로 느려지고 화면이 선두 쪽으로 1.5배 당겨짐.
       1위가 들어온 뒤 0.3초가 지나면(실제 시간 최대 1.6초) 원래 속도로 돌아옴 */
    const SLOW_RATE = 0.4, SLOW_FROM = 0.95, SLOW_AFTER = 0.3, SLOW_MAX = 1.6, ZOOM_MAX = 1.5;
    let lastNow = performance.now(), simT = 0, rate = 1, slowReal = 0, zoom = 1, zx = 0, zy = 0;
    scX = 0; ghostClock = 0;
    const frame = now => {
      const realDt = Math.min(0.05, Math.max(0, (now - lastNow) / 1000)); lastNow = now;
      const leadPos = Math.max(...pos);
      const wantSlow = !RM && slowReal < SLOW_MAX &&
        (finished.length ? simT - finished[0].time < SLOW_AFTER : leadPos >= SLOW_FROM);
      if (wantSlow) slowReal += realDt;
      rate += ((wantSlow ? SLOW_RATE : 1) - rate) * Math.min(1, realDt * 10);
      stageEl.classList.toggle('slow', wantSlow);
      simT += realDt * rate;
      const t = simT;
      const prevT = lastT, dt = Math.max(0, t - prevT);
      lastT = t;
      const before = pos.slice();
      const just = [];
      race.forEach((r, i) => {
        if (!r.done) {
          /* 각 말의 진행 시계: 폭주 구간과 겹친 시간만큼 1.2배로 흐름 */
          let adv = dt;
          const bb = boostOf(i);
          if (bb) adv += (BOOST_MUL - 1) * Math.max(0, Math.min(t, bb.t1) - Math.max(prevT, bb.t0));
          if (r.c + adv >= r.T) r.fin = adv > 0 ? prevT + (r.T - r.c) * dt / adv : t;
          r.c = Math.min(r.T, r.c + adv);
        }
        const u = r.c / r.T;
        let p = 1;
        if (u < 1) {
          let w = 0;
          r.waves.forEach(wv => { w += wv.a * Math.sin(2 * Math.PI * wv.f * u + wv.ph); });
          p = Math.min(0.999, Math.max(r.last, u + Math.sin(Math.PI * u) * w));
        } else if (!r.done) {
          r.done = true; just.push(i);
        }
        r.last = p; pos[i] = p;
      });
      just.sort((a, b) => race[a].fin - race[b].fin).forEach(i => finishHorse(i, race[i].fin));
      boosts.forEach(b => { if (b.on && (t >= b.t1 || race[b.i].done)) { b.on = false; horseEls[b.i].classList.remove('boost'); } });
      while (boostAts.length && Math.max(...pos) >= boostAts[0]) {
        boostAts.shift();
        const pick = [...Array(n).keys()].filter(i => !race[i].done).sort((a, b) => pos[b] - pos[a]).slice(3).filter(i => !boostOf(i));
        if (pick.length) {
          const i = pick[Math.floor(Math.random() * pick.length)];
          boosts.push({ i, t0: t, t1: t + BOOST_SEC, on: true });
          setBoostFx(i, true);
          const txt = boosts.length === 1
            ? '🔥 ' + players[i].name + ', 폭주합니다! 무서운 속도로 치고 나갑니다!'
            : '🔥 ' + players[i].name + '도 폭주합니다! 다크호스가 또 나타났어요!';
          cm.text = txt; cm.t = t; cm.hold = t + 1.3; putStatus('🎙️ ' + txt);
        }
      }
      boosts.forEach(b => { if (!b.on && !b.cleared) { b.cleared = true; if (!race[b.i].done) setBoostFx(b.i, false); } });
      if (!pfSnap && finished.length) pfSnap = { pos: pos.slice(), track: laneW - hw, hw };
      updateRanks();
      commentary(t);
      applyPos(t);
      if (!RM) {
        const track = laneW - hw;
        race.forEach((r, i) => { if (!r.done) spawnFx(i, Math.max(0, pos[i] - before[i]) * track, !!(boostOf(i) && boostOf(i).on), dt); });
        fxStep(dt);
        scrollScenery(dt, 1 - 0.8 * finished.length / n);
        /* 줌 중심: 1위가 들어왔으면 1위 말, 아니면 지금 선두 */
        let li = 0;
        if (finished.length) li = finished[0].no - 1;
        else for (let i = 1; i < pos.length; i++) if (pos[i] > pos[li]) li = i;
        const g = geo[li];
        if (g) {
          const tx = g.ox + pos[li] * track + hw * 0.6, ty = g.oy + g.hh * 0.5;
          if (zoom < 1.004) { zx = tx; zy = ty; }
          else { const e = Math.min(1, realDt * 8); zx += (tx - zx) * e; zy += (ty - zy) * e; }
        }
        zoom += ((wantSlow ? ZOOM_MAX : 1) - zoom) * Math.min(1, realDt * 6);
        if (zoom > 1.004) {
          lanesEl.style.transformOrigin = zx.toFixed(1) + 'px ' + zy.toFixed(1) + 'px';
          lanesEl.style.transform = 'scale(' + zoom.toFixed(4) + ')';
        } else if (lanesEl.style.transform) resetCam();
      }
      /* 1위가 결승선을 통과하면 초시계를 1위 기록에서 멈춤 (순위표와 같은 소수 둘째 자리) */
      clockEl.textContent = finished.length ? finished[0].time.toFixed(2) + '초' : t.toFixed(1) + '초';

      if (finished.length === n && t > maxT + 0.5) {
        racing = false;
        resetCam();
        fxTail();
        clockEl.textContent = finished[0].time.toFixed(2) + '초';
        renderRoster(); updateControls(); setStatus();
        measure(); applyPos(lastT);
        settleLegs();
        musicStop();
        /* 결승 후 폭죽이 끝날 때까지 가로 전체화면을 유지한 뒤 원래 세로 방향으로 복귀 */
        /* 결승 후 폭죽이 끝날 때까지 관중이 계속 환호 */
        arenaEl.classList.add('cheer');
        setTimeout(() => { sfx.end(); fireConfetti(); }, 150);
        celebTimer = setTimeout(() => exitFull(), 3150); /* 폭죽(150ms 후 발사) 뒤 3초 대기 */
        return;
      }
      raf = requestAnimationFrame(frame);
    };
    raf = requestAnimationFrame(frame);
  }

  /* ---------- 8. 폭죽 · 카운트다운 ---------- */
  /* 축포: 경주로 양쪽 아래에서 색종이가 터져 올라감 (3번 연속) */
  let confRaf = 0, confTimers = [];
  function stopConfetti() {
    cancelAnimationFrame(confRaf); confRaf = 0;
    confTimers.forEach(clearTimeout); confTimers = [];
    const c = confettiEl.getContext('2d');
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.clearRect(0, 0, confettiEl.width, confettiEl.height);
  }
  function fireConfetti() {
    stopConfetti();
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const W = stageEl.clientWidth, H = stageEl.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!W || !H) return;
    confettiEl.width = Math.round(W * dpr); confettiEl.height = Math.round(H * dpr);
    const c = confettiEl.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const COLORS = ['#FF4D4D', '#FFC62F', '#2F7DF0', '#18A957', '#E8579A', '#8E44C9', '#12B5C9', '#FFFFFF'];
    const G = 900, v0 = Math.sqrt(2 * G * H * 0.95), parts = [];
    const shoot = (x, ang, n) => {
      for (let i = 0; i < n; i++) {
        const a = ang + (Math.random() - 0.5) * 0.8, s = v0 * (0.5 + Math.random() * 0.55);
        parts.push({
          x, y: H, vx: Math.cos(a) * s * 0.7, vy: Math.sin(a) * s,
          w: 6 + Math.random() * 6, h: 4 + Math.random() * 6,
          rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 12,
          c: COLORS[Math.floor(Math.random() * COLORS.length)],
          age: 0, max: 2.4 + Math.random() * 1.2
        });
      }
    };
    [0, 0.45, 0.9].forEach(dt => confTimers.push(setTimeout(() => {
      shoot(8, -Math.PI / 3, 55);
      shoot(W - 8, -2 * Math.PI / 3, 55);
      if (dt > 0) sfx.pop();
    }, dt * 1000)));
    const t0 = performance.now();
    let last = t0;
    const step = now => {
      const dt = Math.min(0.04, (now - last) / 1000); last = now;
      c.clearRect(0, 0, W, H);
      let alive = 0;
      parts.forEach(p => {
        p.age += dt;
        if (p.age >= p.max) return;
        alive++;
        p.vy += G * dt; p.vx *= 0.992; p.vy *= 0.992;
        p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
        const hh = p.h * Math.abs(Math.cos(p.rot * 1.7)) + 1;
        c.save();
        c.globalAlpha = Math.min(1, (p.max - p.age) / 0.5);
        c.translate(p.x, p.y); c.rotate(p.rot);
        c.fillStyle = p.c;
        c.fillRect(-p.w / 2, -hh / 2, p.w, hh);
        c.restore();
      });
      if (alive || now - t0 < 1300) confRaf = requestAnimationFrame(step); else stopConfetti();
    };
    confRaf = requestAnimationFrame(step);
  }

  /* 시작 버튼 자리에 3, 2, 1, 출발 순서로 카운트다운을 보여주고 출발과 함께 총성 */
  function showCount(txt, go) {
    cdEl.textContent = '';
    const s = document.createElement('span');
    if (go) s.className = 'go';
    s.textContent = txt;
    cdEl.appendChild(s);
    cdEl.hidden = false;
  }
  function hideCount() { cdEl.hidden = true; cdEl.textContent = ''; }

  function beginCountdown() {
    if (!(racing || counting || players.length < MIN)) keepAwake(); /* 버튼을 누른 순간에 요청해야 허용됨 */
    if (racing || counting || players.length < MIN) return;
    setMsg('');
    finished = [];
    resultsEl.textContent = '';
    emptyEl.hidden = false;
    clockEl.textContent = '0.0초';
    stopConfetti();
    enterFull();
    buildLanes();
    updateRanks();
    counting = true;
    updateControls(); setStatus();
    const tick = n => {
      showCount(String(n)); sfx.tick();
      if (n === 1) { putStatus('🎙️ 숨 막히는 정적, 곧 출발합니다!'); }
    };
    tick(3);
    setTimeout(() => tick(2), 1000);
    setTimeout(() => tick(1), 2000);
    setTimeout(() => {
      counting = false;
      showCount('출발', true);
      runRace();
      setTimeout(hideCount, 900);
    }, 3000);
  }

  /* ---------- 9. 버튼 · 입력 처리 · 시작 ---------- */
  function removePlayer(id) {
    if (racing || counting) return;
    players = players.filter(p => p.id !== id);
    setMsg('');
    renderRoster(); resetRace();
  }

  /* 이름 추가. 클로드 미리보기 같은 샌드박스 화면에서는 form 제출(submit)이 막혀 있어서
     추가 버튼 클릭과 Enter 키를 직접 처리합니다. */
  let lastAddAt = 0, pendingEnter = false;

  /* 이름 길이 제한: 한글은 3글자, 알파벳(숫자·기호 포함)은 6글자까지.
     한글 1글자 = 2칸, 그 밖의 글자 = 1칸으로 세어 최대 6칸 (예: 한글 2자 + 영문 2자) */
  const NAME_UNITS = 6;
  const isHangul = ch => /[ᄀ-ᇿ㄰-㆏가-힣]/.test(ch);
  function clipName(str) {
    let units = 0, out = '';
    for (const ch of Array.from(str)) {
      const w = isHangul(ch) ? 2 : 1;
      if (units + w > NAME_UNITS) return { text: out, cut: true };
      units += w; out += ch;
    }
    return { text: out, cut: false };
  }
  function enforceNameLimit() {
    const r = clipName(input.value);
    if (r.cut) {
      input.value = r.text;
      setMsg('이름은 한글 3글자, 영문 6글자까지 입력할 수 있어요.');
    }
  }
  input.addEventListener('input', e => {
    /* 한글 조합 중에는 자르지 않고, 조합이 끝난 뒤에 자름 */
    if (e.isComposing) return;
    enforceNameLimit();
  });
  input.addEventListener('compositionend', () => setTimeout(enforceNameLimit, 0));

  function tryAdd() {
    if (racing || counting) return;
    const name = clipName(input.value.trim().replace(/\s+/g, ' ')).text.trim();
    if (!name) {
      /* 한글 입력 중 Enter가 두 번 들어오는 브라우저: 방금 추가했으면 조용히 넘어감 */
      if (Date.now() - lastAddAt < 400) return;
      setMsg('이름을 입력해 주세요.'); input.focus(); return;
    }
    if (players.length >= MAX) { setMsg('최대 ' + MAX + '명까지 참가할 수 있어요.'); input.focus(); return; }
    if (players.some(p => p.name.toLowerCase() === name.toLowerCase())) { setMsg('이미 있는 이름이에요.'); input.focus(); return; }
    setMsg('');
    addPlayer(name);
    lastAddAt = Date.now();
    sfx.add();
    input.value = '';
    renderRoster(); resetRace();
    if (!input.disabled) input.focus();
  }
  form.addEventListener('submit', e => { e.preventDefault(); tryAdd(); });
  addBtn.addEventListener('click', tryAdd);
  input.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    /* 한글 조합 중 Enter: 조합이 끝난 뒤에 추가 */
    if (e.isComposing || e.keyCode === 229) { pendingEnter = true; return; }
    e.preventDefault();
    tryAdd();
  });
  input.addEventListener('compositionend', () => {
    if (!pendingEnter) return;
    pendingEnter = false;
    setTimeout(() => { if (input.value.trim()) tryAdd(); }, 0);
  });

  resetBtn.addEventListener('click', () => {
    if (racing || counting) return;
    players = []; nextId = 1; setMsg('');
    input.value = '';
    renderRoster(); resetRace();
    input.focus();
  });

  /* 경주마 추가: 누를 때마다 두 글자 경주마 이름을 무작위로 한 명씩 추가, 8명이면 비활성화 */
  sampleBtn.addEventListener('click', () => {
    if (racing || counting || players.length >= MAX) return;
    const free = SAMPLES.filter(n => !players.some(p => p.name === n));
    if (!free.length) return;
    setMsg('');
    addPlayer(free[Math.floor(Math.random() * free.length)]);
    sfx.add();
    renderRoster(); resetRace();
  });

  soundBtn.addEventListener('click', () => {
    soundOn = !soundOn;
    soundBtn.setAttribute('aria-pressed', String(soundOn));
    soundBtn.textContent = soundOn ? '🔊 효과음 켜짐' : '🔇 효과음 꺼짐';
    if (soundOn) sfx.add(); else musicStop();
  });

  durInputs.forEach(i => i.addEventListener('change', () => { updateHead(); updateControls(); }));
  startBtn.addEventListener('click', () => { askMotion(); beginCountdown(); });
  dhBtn.addEventListener('click', () => {
    darkHorse = !darkHorse;
    dhBtn.setAttribute('aria-pressed', String(darkHorse));
    dhBtn.textContent = darkHorse ? '🔥 다크호스 모드 켜짐' : '🐴 다크호스 모드 꺼짐';
    sfx.add();
  });

  const remeasure = () => {
    fitRot(); fitLanes(); fitIdle(); measure(); applyPos(lastT); fitWinner();
  };
  if (window.ResizeObserver) { const ro = new ResizeObserver(remeasure); ro.observe(lanesEl); ro.observe(stageEl); }
  window.addEventListener('resize', remeasure);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { measure(); applyPos(lastT); });

  updateHead();
  renderRoster();
  resetRace();
})();
</script>

</body>
