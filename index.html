<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>경마 레이스</title>
<!-- 홈 화면 아이콘·이름 -->
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<!-- 글꼴 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* =====================================================================
   목차
   1. 기본 설정 · 색상 변수(라이트/다크)
   2. 머리말 · 참가자 입력 카드
   3. LIVE 바 · 경주로 · 시작/다크호스 버튼 · 카운트다운
   4. 경주 종료: 시상대 · 결승 판독 사진 · 폭죽
   5. 말 그림 · 이름표 · 폭주 불꽃
   6. 순위표
   7. 경주 중 전체화면(가로) · 큰 PC 모니터
   8. 경주 연출: 관중석 배경 · 흙먼지 · 슬로모션
   9. 움직임 줄이기 설정
   ===================================================================== */

/* ---------- 1. 기본 설정 · 색상 변수 ---------- */
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
img { max-width: 100%; }
[hidden]:not([hidden=until-found i]) { display: none !important; }

/* 레이아웃: 둥근 하늘색 무대 카드 한 장 안에 위에서 아래로 배지·제목 → 입력 카드 → LIVE 바 → 초록 테두리 흙길 경주로 → 메달 순위표. */
:root {
  --page: #EEF3F7;
  --sky-a: #D6EFF8;
  --sky-b: #DCF6E7;
  --sky-line: #C7E7EE;
  --fg: #1B2433;
  --muted: #526076;
  --title: #0E5A3A;
  --title-shadow: 0 2px 0 rgba(255, 255, 255, 0.85), 0 4px 10px rgba(14, 90, 58, 0.18);
  --card: #FFFFFF;
  --card-line: #BDEADB;
  --field: #FFFFFF;
  --field-line: #C3D2E3;
  --chip: #FFFFFF;
  --pill-bg: #F1F5FA;
  --pill-line: #D3DDE8;
  --blue: #0E96DC;
  --blue-hi: #29AEF0;
  --blue-deep: #0A6FA3;
  --grey-btn: #E4E8EF;
  --grey-deep: #C0C8D6;
  --grey-fg: #3B465A;
  --green: #12A15F;
  --green-hi: #22C178;
  --green-deep: #0A7444;
  --green-solid: #0E8A52;
  --green-text: #0A7444;
  --badge: #FFC62F;
  --badge-fg: #5A3A00;
  --navy: #12183A;
  --navy-hi: #1D2558;
  --navy-line: #2C3570;
  --live: #FF6B88;
  --live-bg: #54152C;
  --cyan: #5EE6D2;
  --yellow-text: #FFD54A;
  --dirt: #A87450;
  --dirt-line: rgba(255, 255, 255, 0.38);
  --frame: #0D7A55;
  --frame-hi: #18996B;
  --edge: #86380F;
  --res-line: #FFD64F;
  --res-tint: #FFFBEA;
  --row-bg: #FFFFFF;
  --row-line: #E1E7EF;
  --gold-bg: #FFF3BA;
  --gold-line: #F2B71F;
  --silver-bg: #EEF1F9;
  --silver-line: #A3ADCB;
  --bronze-bg: #FFF1E1;
  --bronze-line: #F4B27A;
  --medal-gold: #F5A21B;
  --medal-gold-fg: #4A2C00;
  --medal-silver: #5F6C87;
  --medal-bronze: #C8400B;
  --medal-navy: #1F2A47;
  --st-wait-bg: #EEF2F7;
  --st-wait-fg: #4C586E;
  --st-run-bg: #FFEFBD;
  --st-run-fg: #7A4B00;
  --st-done-bg: #D6F5E4;
  --st-done-fg: #0A6F42;
  --danger: #C62F2F;
  --focus: #2F6FEB;
  --font-display: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-body: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --hw: 62px;
  --lh: 70px;
  --th: 20px;
}
@media (min-width: 560px) {
  :root { --hw: 88px; --lh: 88px; --th: 22px; }
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0A0F1A;
    --sky-a: #10283C;
    --sky-b: #10332E;
    --sky-line: #1E4A55;
    --fg: #E8EEF8;
    --muted: #A5B3C9;
    --title: #8FE9BC;
    --title-shadow: none;
    --card: #162033;
    --card-line: #285A58;
    --field: #0F1727;
    --field-line: #33445F;
    --chip: #1B2840;
    --pill-bg: #1B2840;
    --pill-line: #33445F;
    --blue: #1597DC;
    --blue-hi: #23A6EA;
    --blue-deep: #0B5F8E;
    --grey-btn: #2B3850;
    --grey-deep: #1A2336;
    --grey-fg: #E1E8F4;
    --green-solid: #0F8F55;
    --green-text: #7CE3AE;
    --navy: #0B1030;
    --navy-hi: #151C48;
    --frame: #0B6A49;
    --frame-hi: #108458;
    --edge: #6D2D0B;
    --res-line: #B88A12;
    --res-tint: #1B2438;
    --row-bg: #1B2840;
    --row-line: #2C3B57;
    --gold-bg: #3B3216;
    --gold-line: #C79A1B;
    --silver-bg: #252E46;
    --silver-line: #6C7AA3;
    --bronze-bg: #3A281C;
    --bronze-line: #B8743F;
    --st-wait-bg: #243149;
    --st-wait-fg: #B4C1D6;
    --st-run-bg: #4A3A0F;
    --st-run-fg: #FFD875;
    --st-done-bg: #11402D;
    --st-done-fg: #8CE9B9;
    --danger: #FF8A8A;
    --focus: #7AA2FF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #0A0F1A;
  --sky-a: #10283C;
  --sky-b: #10332E;
  --sky-line: #1E4A55;
  --fg: #E8EEF8;
  --muted: #A5B3C9;
  --title: #8FE9BC;
  --title-shadow: none;
  --card: #162033;
  --card-line: #285A58;
  --field: #0F1727;
  --field-line: #33445F;
  --chip: #1B2840;
  --pill-bg: #1B2840;
  --pill-line: #33445F;
  --blue: #1597DC;
  --blue-hi: #23A6EA;
  --blue-deep: #0B5F8E;
  --grey-btn: #2B3850;
  --grey-deep: #1A2336;
  --grey-fg: #E1E8F4;
  --green-solid: #0F8F55;
  --green-text: #7CE3AE;
  --navy: #0B1030;
  --navy-hi: #151C48;
  --frame: #0B6A49;
  --frame-hi: #108458;
  --edge: #6D2D0B;
  --res-line: #B88A12;
  --res-tint: #1B2438;
  --row-bg: #1B2840;
  --row-line: #2C3B57;
  --gold-bg: #3B3216;
  --gold-line: #C79A1B;
  --silver-bg: #252E46;
  --silver-line: #6C7AA3;
  --bronze-bg: #3A281C;
  --bronze-line: #B8743F;
  --st-wait-bg: #243149;
  --st-wait-fg: #B4C1D6;
  --st-run-bg: #4A3A0F;
  --st-run-fg: #FFD875;
  --st-done-bg: #11402D;
  --st-done-fg: #8CE9B9;
  --danger: #FF8A8A;
  --focus: #7AA2FF;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { scrollbar-gutter: stable; }
body {
  margin: 0;
  background: var(--page);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  word-break: keep-all;
  overflow-wrap: anywhere;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.app { max-width: 620px; margin: 0 auto; }
.stage-card {
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding: 22px 14px 24px;
  border: 1px solid var(--sky-line);
  border-radius: 30px;
  background:
    radial-gradient(120% 60% at 50% 0%, rgba(255, 255, 255, 0.55), transparent 60%),
    linear-gradient(180deg, var(--sky-a), var(--sky-b));
  box-shadow: 0 14px 36px rgba(20, 70, 90, 0.14);
  min-width: 0;
}
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- 2. 머리말 · 참가자 입력 카드 ---------- */
.hero { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.badge {
  display: inline-block;
  padding: 6px 16px;
  border-radius: 999px;
  background: linear-gradient(180deg, #FFD65C, var(--badge));
  color: var(--badge-fg);
  font-size: 14px;
  font-weight: 700;
  box-shadow: 0 3px 0 rgba(90, 58, 0, 0.2);
}
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(28px, 8.4vw, 42px);
  line-height: 1.15;
  color: var(--title);
  text-shadow: var(--title-shadow);
  text-wrap: balance;
}
.sub { margin: 0; max-width: 34ch; color: var(--muted); font-size: 14px; text-wrap: balance; }

.card {
  min-width: 0;
  padding: 18px 16px;
  border: 2px solid var(--card-line);
  border-radius: 26px;
  background: var(--card);
  box-shadow: 0 8px 22px rgba(20, 120, 110, 0.12);
}
.setup h2 { margin: 0 0 12px; font-size: 16px; font-weight: 700; }
.cnt { color: var(--green-text); }
input[type="text"] {
  width: 100%;
  height: 52px;
  padding: 0 16px;
  border: 2px solid var(--field-line);
  border-radius: 16px;
  background: var(--field);
  color: var(--fg);
  font: inherit;
  font-size: 16px;
  transition: border-color 0.15s, box-shadow 0.15s;
}
input[type="text"]:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 4px rgba(14, 150, 220, 0.18); }
input[type="text"]::placeholder { color: var(--muted); opacity: 0.8; }
input[type="text"]:disabled { opacity: 0.55; }
.btnrow { display: grid; grid-template-columns: 1.15fr 1fr; gap: 12px; margin-top: 12px; padding-bottom: 5px; }
.b3d {
  height: 52px;
  min-width: 0;
  border: 0;
  border-radius: 16px;
  font: inherit;
  font-size: 17px;
  font-weight: 700;
  color: #fff;
  cursor: pointer;
  box-shadow: 0 5px 0 var(--deep);
  transition: transform 0.08s ease, box-shadow 0.08s ease;
}
.b3d:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--deep); }
.b3d:disabled { opacity: 0.5; cursor: not-allowed; }
.b3d.blue { background: linear-gradient(180deg, var(--blue-hi), var(--blue)); --deep: var(--blue-deep); }
.b3d.grey { background: var(--grey-btn); color: var(--grey-fg); --deep: var(--grey-deep); }

.dur {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 10px;
  margin-top: 14px;
  padding: 8px 10px;
  border: 1.5px solid var(--pill-line);
  border-radius: 20px;
  background: var(--pill-bg);
}
.durlabel { flex: none; font-size: 13px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.seg { flex: 1; min-width: 190px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.seg label { position: relative; display: block; min-width: 0; }
.seg span {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 36px;
  border: 1.5px solid var(--pill-line);
  border-radius: 999px;
  background: var(--card);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
.seg input:checked + span { background: var(--green-solid); border-color: var(--green-solid); color: #fff; box-shadow: 0 3px 0 var(--green-deep); }
.seg input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 2px; }
.seg input:disabled + span { opacity: 0.5; cursor: not-allowed; }

.msg { min-height: 20px; margin: 6px 0 0; color: var(--danger); font-size: 13px; font-weight: 500; }
.tools {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 4px 0 16px;
  border-bottom: 1.5px solid var(--pill-line);
  color: var(--muted);
  font-size: 13px;
}
.textbtn {
  flex: 1 1 140px;
  min-width: 0;
  height: 52px;
  padding: 0 8px;
  white-space: nowrap;
  border: 2px solid var(--pill-line);
  border-radius: 999px;
  background: var(--pill-bg);
  color: var(--fg);
  font: inherit;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}
.textbtn#sampleBtn, #soundBtn { flex: 1 1 0; }
.textbtn:active:not(:disabled) { transform: translateY(1px); }
.textbtn:disabled { opacity: 0.45; cursor: not-allowed; }
/* 효과음: 켜짐은 노란색, 꺼짐은 옅은 회색 */
#soundBtn[aria-pressed="true"] { background: var(--badge); border-color: var(--badge); color: var(--badge-fg); }
#soundBtn[aria-pressed="false"] { background: var(--grey-btn); border-color: var(--grey-btn); color: var(--muted); }
.roster { list-style: none; margin: 14px 0 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.chip {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  padding: 6px 8px 6px 6px;
  border: 2.5px solid var(--c);
  border-radius: 999px;
  background: linear-gradient(90deg, color-mix(in srgb, var(--c) 14%, var(--chip)), var(--chip) 60%);
  font-weight: 700;
  animation: rise 0.3s ease-out;
}
/* 참가자 번호: 경주로 번호판·말 등번호와 같은 숫자 */
.cno { flex: none; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; font-family: var(--font-display); font-size: 15px; line-height: 1; box-shadow: 0 2px 0 rgba(0, 0, 0, 0.18); }
.dot { width: 14px; height: 14px; border-radius: 50%; flex: none; }
.cname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.x { flex: none; width: 26px; height: 26px; border: 0; border-radius: 50%; background: var(--pill-bg); color: var(--muted); font-size: 17px; line-height: 1; cursor: pointer; }
.x:hover:not(:disabled) { background: var(--pill-line); color: var(--fg); }
.x:disabled { opacity: 0.35; cursor: not-allowed; }
.roster-empty { grid-column: 1 / -1; padding: 14px; border: 1.5px dashed var(--pill-line); border-radius: 16px; color: var(--muted); font-size: 14px; text-align: center; }

/* ---------- 3. LIVE 바 · 경주로 · 시작/다크호스 버튼 · 카운트다운 ---------- */
.live {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  padding: 12px 14px;
  min-height: 68px;
  border: 3px solid var(--navy-line);
  border-radius: 20px;
  background:
    repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.025) 0 2px, transparent 2px 4px),
    linear-gradient(180deg, var(--navy-hi), var(--navy));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 8px 18px rgba(10, 15, 50, 0.22);
}
.livebadge { flex: none; padding: 5px 10px; border-radius: 8px; background: var(--live-bg); color: var(--live); font-size: 12px; font-weight: 900; letter-spacing: 0.08em; }
.livebadge.on { background: #E11D48; color: #fff; animation: blink 1s ease-in-out infinite; box-shadow: 0 0 12px rgba(225, 29, 72, 0.7); }
@keyframes blink { 50% { opacity: 0.55; } }
.status { flex: 1; min-width: 0; display: flex; align-items: flex-start; gap: 6px; color: var(--yellow-text); font-size: 14px; font-weight: 700; line-height: 1.3; text-shadow: 0 0 10px rgba(255, 213, 74, 0.25); }
.sti { flex: none; width: 1.5em; text-align: center; }
.stt { flex: 1; min-width: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.clockpill {
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-width: 100px;
  padding: 7px 12px;
  border: 1.5px solid #3A4380;
  border-radius: 999px;
  background: #0A0F2E;
  color: var(--cyan);
  font-size: 15px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 0 8px rgba(94, 230, 210, 0.55);
  box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
}

.trackframe {
  padding: 10px 10px 12px;
  border: 6px solid var(--edge);
  border-radius: 26px;
  background:
    repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.05) 0 22px, transparent 22px 44px),
    linear-gradient(180deg, var(--frame-hi), var(--frame));
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.15), 0 10px 24px rgba(60, 30, 10, 0.22);
  min-width: 0;
}
.thead { display: flex; justify-content: space-between; gap: 6px; padding: 2px 4px 8px; color: #fff; font-size: 12px; font-weight: 700; white-space: nowrap; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3); }
.thead #dist { padding: 0 8px; border-radius: 999px; background: rgba(0, 0, 0, 0.22); }
.stage {
  position: relative;
  overflow: hidden;
  border: 2px solid rgba(0, 0, 0, 0.22);
  border-radius: 14px;
  background:
    radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.06) 0 1.5px, transparent 2px) 0 0 / 18px 14px,
    radial-gradient(circle at 70% 70%, rgba(0, 0, 0, 0.08) 0 1.5px, transparent 2px) 0 0 / 23px 17px,
    repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.05) 0 2px, transparent 2px 16px),
    linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(0, 0, 0, 0.12)),
    var(--dirt);
  box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.75), inset 0 -3px 0 rgba(255, 255, 255, 0.75), inset 0 8px 14px rgba(0, 0, 0, 0.18);
}
.stage.idle .lanes { filter: grayscale(1); }
.lanes { position: relative; padding: 6px 14px 6px 52px; transition: filter 0.4s ease; }
.lanes::before { content: ""; position: absolute; left: 48px; top: 0; bottom: 0; width: 3px; background: rgba(255, 255, 255, 0.85); }
.lanes::after {
  content: "";
  position: absolute;
  right: 0; top: 0; bottom: 0;
  width: 14px;
  background: repeating-conic-gradient(#F4F5F7 0% 25%, #15171D 0% 50%) 0 0 / 14px 14px;
  box-shadow: -3px 0 6px rgba(0, 0, 0, 0.2);
}
.lane { position: relative; flex: none; height: var(--lh); }
.lane + .lane { border-top: 2px dashed var(--dirt-line); }
.numbadge {
  position: absolute;
  left: -46px;
  top: 50%;
  transform: translateY(-50%);
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border-radius: 10px;
  font-family: var(--font-display);
  font-size: 18px;
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.3), 0 2px 0 rgba(0, 0, 0, 0.28);
}
.numbadge.bump { animation: bump 0.25s ease-out; }
@keyframes bump { 0% { transform: translateY(-50%) scale(1.3); } 100% { transform: translateY(-50%) scale(1); } }
.lanes-empty { min-height: 160px; display: grid; place-items: center; padding: 14px 16px; margin-left: -34px; color: rgba(255, 255, 255, 0.92); font-size: 14px; font-weight: 500; text-align: center; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35); }

.cta { position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 12px; pointer-events: none; }
.cta > * { pointer-events: auto; }
.startbtn {
  min-width: 200px;
  height: 60px;
  padding: 0 32px;
  border: 4px solid #fff;
  border-radius: 999px;
  background: linear-gradient(180deg, var(--green-hi), var(--green-solid));
  color: #fff;
  font-family: var(--font-display);
  font-size: 24px;
  text-shadow: 0 2px 0 rgba(0, 0, 0, 0.18);
  cursor: pointer;
  box-shadow: 0 8px 18px rgba(0, 0, 0, 0.3);
  transition: transform 0.1s ease;
}
.startbtn:not(:disabled) { animation: ready 1.8s ease-in-out infinite; }
@keyframes ready {
  0%, 100% { box-shadow: 0 8px 18px rgba(0, 0, 0, 0.3), 0 0 0 0 rgba(255, 255, 255, 0.7); }
  50% { box-shadow: 0 8px 18px rgba(0, 0, 0, 0.3), 0 0 0 12px rgba(255, 255, 255, 0); }
}
.startbtn:hover:not(:disabled) { transform: translateY(-1px); }
.startbtn:active:not(:disabled) { transform: scale(0.97); }
.startbtn:disabled { background: #7D8A99; cursor: not-allowed; }
/* 다크호스 모드(폭주 기능) 켜고 끄기 */
.dhbtn { min-width: 200px; height: 40px; padding: 0 20px; border: 3px solid #fff; border-radius: 999px; background: #3A4150; color: #D5DAE3; font-family: var(--font-display); font-size: 16px; cursor: pointer; box-shadow: 0 6px 14px rgba(0, 0, 0, 0.28); transition: transform 0.1s ease, background 0.15s; }
.dhbtn[aria-pressed="true"] { background: linear-gradient(90deg, #2A1A3A, #5A1E1E); color: #FFD27A; box-shadow: 0 0 0 2px #FF7A1A, 0 6px 16px rgba(255, 90, 20, 0.45); }
.dhbtn:active:not(:disabled) { transform: scale(0.97); }

.countdown { position: absolute; inset: 0; z-index: 4; display: grid; place-items: center; pointer-events: none; }
.countdown span {
  display: grid;
  place-items: center;
  width: 112px;
  height: 112px;
  border: 5px solid #fff;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, var(--green-hi), var(--green-solid));
  color: #fff;
  font-family: var(--font-display);
  font-size: 62px;
  line-height: 1;
  box-shadow: 0 8px 18px rgba(0, 0, 0, 0.32);
  animation: cdpop 0.5s ease-out;
}
.countdown span.go { width: 128px; height: 128px; background: radial-gradient(circle at 35% 30%, #FF4D73, #D1123F); font-size: 38px; }
@keyframes cdpop { from { transform: scale(1.7); opacity: 0; } 60% { opacity: 1; } to { transform: scale(1); opacity: 1; } }

/* ---------- 4. 경주 종료: 시상대 · 결승 판독 사진 · 폭죽 ---------- */
/* 경주가 끝나면 시상대·판독 사진·버튼이 들어가도록 경주로를 늘림 */
.stage.done .lanes { min-height: 420px; display: flex; flex-direction: column; justify-content: center; }
.stage.done.hasdh .lanes { min-height: 470px; } /* 다크호스 모드 버튼(약 50px)만큼 여유 */
/* 전체화면 경주 중에는 우승 표시가 나와도 말 위치가 밀리지 않도록 높이를 늘리지 않음 */
.arena.full .stage.done .lanes { min-height: 0; }
.winner {
  width: min(100%, 340px);
  padding: 10px 10px 0;
  border: 4px solid var(--gold-line);
  border-radius: 28px;
  background: radial-gradient(120% 90% at 50% 0%, var(--gold-bg), var(--card) 72%);
  box-shadow: 0 12px 27px rgba(0, 0, 0, 0.3);
  overflow: hidden;
  animation: drop 0.55s cubic-bezier(0.2, 1.4, 0.4, 1);
}
/* 시상대: 가운데 1위(가장 높음), 왼쪽 2위, 오른쪽 3위. 각 단 위에 말이 서고 그 위에 이름표 */
.podium { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1.2fr 1fr; align-items: end; }
.podium.two { grid-template-columns: 1fr 1.2fr; }
.podium li { min-width: 0; display: flex; flex-direction: column; align-items: center; animation: stepUp 0.5s cubic-bezier(0.2, 1.2, 0.4, 1) backwards; }
.podium .p1 { order: 2; animation-delay: 0.55s; }
.podium .p2 { order: 1; animation-delay: 0.35s; }
.podium .p3 { order: 3; animation-delay: 0.15s; }
@keyframes stepUp { from { transform: translateY(110%); } to { transform: none; } }
.p1::before { content: "👑"; font-size: 18px; line-height: 1; margin-bottom: 1px; }
.pname {
  max-width: calc(100% - 6px);
  padding: 2px 8px 4px;
  border-radius: 999px;
  background: var(--pc, var(--green));
  color: var(--pt, #fff);
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 16px;
  line-height: 1.25;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  box-shadow: 0 2px 0 rgba(0, 0, 0, 0.18);
}
.p1 .pname { padding: 2px 12px 5px; font-size: 24px; }
/* 단 위에 선 말 (경주로의 말 그림을 그대로 사용) */
.horse.phorse { position: relative; left: auto; bottom: auto; width: 46px; margin: 4px 0 -2px; will-change: auto; }
.p1 .horse.phorse { width: 62px; }
.pstep {
  width: 100%;
  display: grid;
  place-items: center;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.2), rgba(0, 0, 0, 0.14)), var(--sc);
  box-shadow: inset 0 5px 0 rgba(255, 255, 255, 0.38), inset 0 -3px 0 rgba(0, 0, 0, 0.12);
  color: #fff;
  font-family: var(--font-display);
  line-height: 1;
  text-shadow: 0 2px 0 rgba(0, 0, 0, 0.18);
}
.p1 .pstep { --sc: var(--medal-gold); height: 58px; border-radius: 10px 10px 0 0; color: var(--medal-gold-fg); font-size: 32px; text-shadow: 0 2px 0 rgba(255, 255, 255, 0.35); }
.p2 .pstep { --sc: var(--medal-silver); height: 42px; border-radius: 10px 0 0 0; font-size: 24px; }
.p3 .pstep { --sc: var(--medal-bronze); height: 30px; border-radius: 0 10px 0 0; font-size: 19px; }
/* 결승 판독 사진: 1위가 결승선에 코를 댄 순간을 찍은 것처럼 1·2위를 보여줌 (시상대 아래) */
.pfoto {
  width: min(100%, 340px);
  padding: 6px 6px 8px;
  border-radius: 10px;
  background: #F7F3EA;
  box-shadow: 0 10px 22px rgba(0, 0, 0, 0.32);
  color: #2A2622;
  animation: drop 0.55s cubic-bezier(0.2, 1.4, 0.4, 1) 0.7s backwards;
}
.pfoto[hidden] { display: none; }
.pfhead { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; padding: 0 2px 5px; font-size: 11px; font-weight: 700; white-space: nowrap; }
.pftitle { letter-spacing: 0.06em; }
.pfmargin { color: #B3261E; font-family: var(--font-display); font-weight: 400; font-size: 14px; overflow: hidden; text-overflow: ellipsis; }
.pfimg {
  --lx: 70%;
  position: relative;
  overflow: hidden;
  border-radius: 4px;
  background:
    repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.07) 0 1px, transparent 1px 5px),
    linear-gradient(180deg, #C9A77C, #A9855A);
  filter: sepia(0.3) contrast(1.06);
}
.pflane { position: relative; height: 46px; }
.pflane + .pflane { border-top: 1px dashed rgba(255, 255, 255, 0.45); }
.pfrun { position: absolute; bottom: 3px; right: calc(100% - var(--lx) - 4px + var(--off, 0px)); display: flex; align-items: center; gap: 4px; }
.pftag { padding: 2px 7px; border-radius: 999px; font-size: 11px; font-weight: 700; line-height: 1.2; white-space: nowrap; box-shadow: 0 1px 0 rgba(0, 0, 0, 0.25); }
.horse.pfh { position: relative; left: auto; bottom: auto; flex: none; width: 64px; will-change: auto; }
/* 사진이므로 달리는 자세 그대로 멈춘 다리 */
.pfh .leg { animation: swing 0.46s ease-in-out infinite paused; animation-delay: calc(var(--d, 0s) - var(--ph, 0s)); }
.pfh .low { animation: knee 0.46s ease-in-out infinite paused; animation-delay: calc(var(--d, 0s) - var(--ph, 0s)); }
.pfline { position: absolute; top: 0; bottom: 0; left: var(--lx); width: 2px; margin-left: -1px; background: #E0241B; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.55); z-index: 2; }
.pftime { position: absolute; top: 50%; left: calc(var(--lx) + 8px); transform: translateY(-50%); color: #fff; font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6); white-space: nowrap; }
.pfrk { position: absolute; top: 4px; left: 5px; display: grid; place-items: center; width: 18px; height: 18px; border-radius: 5px; background: rgba(0, 0, 0, 0.45); color: #fff; font-family: var(--font-display); font-size: 12px; line-height: 1; }
.pfimg::after { content: ""; position: absolute; inset: 0; z-index: 3; background: #fff; opacity: 0; pointer-events: none; animation: pflash 0.8s ease-out 0.9s; }
@keyframes pflash { 0% { opacity: 0; } 10% { opacity: 0.95; } 100% { opacity: 0; } }
/* 전체화면(가로) 동안에는 공간이 좁아 판독 사진을 숨기고, 원래 화면으로 돌아오면 표시 (큰 PC 모니터는 그대로 표시) */
.arena.full:not(.big) .pfoto { display: none; }
@keyframes drop { from { transform: translateY(-30px) scale(0.7); opacity: 0; } to { transform: none; opacity: 1; } }
.confetti { position: absolute; inset: 0; z-index: 6; width: 100%; height: 100%; pointer-events: none; }

/* ---------- 5. 말 그림 · 이름표 · 폭주 불꽃 ---------- */
.horse { position: absolute; left: 0; bottom: 4px; width: var(--hw); will-change: transform; }
.horse::after { content: ""; position: absolute; left: 12%; right: 8%; bottom: -3px; height: 6px; border-radius: 50%; background: rgba(0, 0, 0, 0.25); filter: blur(2px); z-index: -1; }
.horse svg { display: block; width: 100%; height: auto; overflow: visible; fill: currentColor; }
.horse .shade { fill: rgba(0, 0, 0, 0.32); }
.horse .hi { fill: rgba(255, 255, 255, 0.24); }
.horse .blaze { fill: rgba(255, 255, 255, 0.55); }
.horse .cloth { fill: rgba(255, 255, 255, 0.95); }
.horse .num { font-family: var(--font-display); font-size: 9px; fill: #14161C; }
.horse .eye { fill: #fff; }
.horse .pupil { fill: #14161C; }
.leg, .low, .tail { transform-box: view-box; }
.leg path { fill: currentColor; stroke: currentColor; stroke-width: 1; stroke-linejoin: round; }
.leg .hoof { fill: #2B2328; stroke: #2B2328; }
.far { filter: brightness(0.7); }
.running .leg { animation: swing 0.46s ease-in-out infinite; animation-delay: var(--d, 0s); }
.running .low { animation: knee 0.46s ease-in-out infinite; animation-delay: var(--d, 0s); }
.running .tail { animation: wave 0.24s ease-in-out infinite alternate; }
/* 기수: 달릴 때 상체를 살짝 앞뒤로 흔듦 */
.jockey { transform-box: view-box; transform-origin: 44px 20px; }
.running .jockey { animation: ride 0.23s ease-in-out infinite alternate; }
@keyframes ride { from { transform: rotate(-2deg) translateY(0.4px); } to { transform: rotate(2deg) translateY(-0.6px); } }
@keyframes swing { 0% { transform: rotate(-30deg); } 50% { transform: rotate(30deg); } 100% { transform: rotate(-30deg); } }
@keyframes knee { 0% { transform: rotate(2deg); } 50% { transform: rotate(55deg); } 100% { transform: rotate(2deg); } }
@keyframes wave { from { transform: rotate(-7deg); } to { transform: rotate(7deg); } }
/* 폭주하는 말: 몸통 뒤로 불꽃이 피어오르고 주황빛이 감돎 */
.horse svg.flame { position: absolute; left: 0; top: 0; z-index: -1; pointer-events: none; opacity: 0; transform: scale(0.6); transform-origin: 45% 70%; transition: opacity 0.18s, transform 0.18s; }
.horse.boost svg.flame { opacity: 1; transform: none; }
.horse.boost > svg:not(.flame) { filter: drop-shadow(0 0 3px rgba(255, 122, 26, 0.95)) drop-shadow(0 0 7px rgba(255, 70, 20, 0.6)); }
.flame .f1 { fill: #FF4A1C; } .flame .f2 { fill: #FF9A1F; } .flame .f3 { fill: #FFE45C; }
.flame path { transform-box: fill-box; transform-origin: 70% 100%; }
.horse.boost .flame path { animation: flick 0.16s ease-in-out infinite alternate; animation-delay: var(--d, 0s); }
@keyframes flick { from { transform: scale(0.85, 0.78) skewX(4deg); } to { transform: scale(1.06, 1.12) skewX(-6deg); } }
.tag {
  position: absolute;
  left: 0;
  top: calc(var(--lh) - 4px - var(--hw) * 0.3333 - var(--th) / 2);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: var(--th);
  max-width: 100%;
  padding: 0 9px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
  line-height: 1;
  white-space: nowrap;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3), 0 2px 0 rgba(0, 0, 0, 0.22);
  will-change: transform;
}
.tag.done { transition: transform 0.3s ease; }
.tag.first { box-shadow: 0 0 0 2px #fff, 0 2px 0 2px rgba(0, 0, 0, 0.25); }
.tag span { overflow: hidden; text-overflow: ellipsis; }
.rk { margin-right: -4px; padding: 3px 6px; border-radius: 999px; background: rgba(0, 0, 0, 0.24); font-size: 11px; font-weight: 700; animation: pop 0.3s ease-out; }
@keyframes pop { from { opacity: 0; transform: scale(0.7); } to { opacity: 1; transform: none; } }

/* ---------- 6. 순위표 ---------- */
.results { border-color: var(--res-line); background: linear-gradient(180deg, var(--card), var(--res-tint)); }
.rhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
.rhead h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 24px; line-height: 1.2; }
.state { flex: none; padding: 5px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; }
.state.wait { background: var(--st-wait-bg); color: var(--st-wait-fg); }
.state.run { background: var(--st-run-bg); color: var(--st-run-fg); }
.state.done { background: var(--st-done-bg); color: var(--st-done-fg); }
.resultlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.res {
  display: grid;
  grid-template-columns: auto 26px minmax(0, 1fr) auto;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border: 2px solid var(--row-line);
  border-radius: 18px;
  background: var(--row-bg);
  animation: rise 0.35s ease-out;
}
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.res.r1 { padding-block: 16px; border-color: var(--gold-line); background: var(--gold-bg); box-shadow: 0 4px 0 rgba(242, 183, 31, 0.35); }
.res.r2 { border-color: var(--silver-line); background: var(--silver-bg); }
.res.r3 { border-color: var(--bronze-line); background: var(--bronze-bg); }
.rankpill { display: inline-flex; align-items: center; gap: 4px; padding: 5px 12px; border-radius: 999px; background: var(--medal-navy); color: #fff; font-size: 14px; font-weight: 700; white-space: nowrap; }
.r1 .rankpill { background: var(--medal-gold); color: var(--medal-gold-fg); }
.r2 .rankpill { background: var(--medal-silver); }
.r3 .rankpill { background: var(--medal-bronze); }
.res .cno { box-shadow: 0 0 0 2px #fff, 0 2px 0 2px rgba(0, 0, 0, 0.12); }
.rname { font-family: var(--font-display); font-size: 19px; overflow-wrap: anywhere; }
.r1 .rname { font-size: 22px; }
.rtime { display: flex; flex-direction: column; align-items: flex-end; color: var(--muted); font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; line-height: 1.25; }
.rgap { font-size: 12px; opacity: 0.85; }
.empty { margin: 0; padding: 18px 16px; border: 1.5px dashed var(--pill-line); border-radius: 16px; color: var(--muted); font-size: 14px; text-align: center; }
/* 버전 표시: push할 때마다 숫자와 날짜를 올림 */
.ver { margin: 14px 0 0; color: var(--muted); font-size: 12px; text-align: center; opacity: 0.8; }

/* ---------- 7. 경주 중 전체화면(가로) · 큰 PC 모니터 ---------- */
/* 경주 중 전체 화면 모드: LIVE 바 + 경주로가 화면을 꽉 채움 */
.arena { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.arena.full {
  position: fixed;
  inset: 0;
  z-index: 100;
  gap: 10px;
  padding: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
  background: linear-gradient(180deg, var(--sky-a), var(--sky-b));
  animation: arenaIn 0.3s ease-out;
}
.arena.full .trackframe { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.arena.full .stage { flex: 1; min-height: 0; }
.arena.full .lanes { height: 100%; display: flex; flex-direction: column; justify-content: center; }
/* 4명 이하: 가로만 키우고 세로는 원래 높이 유지 (화면 세로 가운데 정렬) */
.arena.full.wide { justify-content: center; }
.arena.full.wide .trackframe, .arena.full.wide .stage { flex: none; }
.arena.full.wide .lanes { height: auto; display: block; }

/* 가로 화면에서는 8마리까지 한 화면에 들어오도록 경주장 구성요소를 압축 */
.arena.full.wide.landscape {
  justify-content: flex-start;
  gap: 5px;
}
.arena.full.wide.landscape .live {
  flex: none;
  min-height: 0;
  padding: 5px 9px;
  gap: 7px;
  border-width: 2px;
  border-radius: 13px;
}
.arena.full.wide.landscape .livebadge {
  padding: 3px 7px;
  font-size: 10px;
}
.arena.full.wide.landscape .status {
  font-size: 12px;
  line-height: 1.15;
}
.arena.full.wide.landscape .clockpill {
  min-width: 0;
  padding: 3px 8px;
  gap: 4px;
  font-size: 12px;
}
.arena.full.wide.landscape .trackframe {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
  padding: 4px 6px 5px;
  border-width: 3px;
  border-radius: 15px;
}
.arena.full.wide.landscape .thead {
  flex: none;
  padding: 0 3px 3px;
  font-size: 10px;
}
.arena.full.wide.landscape .stage {
  flex: 1;
  min-height: 0;
}
.arena.full.wide.landscape .lanes {
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 1px 10px 1px 38px;
}
.arena.full.wide.landscape .lanes::before { left: 35px; width: 2px; }
.arena.full.wide.landscape .lanes::after { width: 9px; background-size: 9px 9px; }
.arena.full.wide.landscape .lane { height: var(--lh); }
.arena.full.wide.landscape .numbadge {
  left: -34px;
  width: 25px;
  height: 25px;
  border-radius: 7px;
  font-size: 14px;
}
.arena.full.wide.landscape .horse { bottom: 1px; }
.arena.full.wide.landscape .tag {
  top: calc(var(--lh) - 1px - var(--hw) * 0.3333 - var(--th) / 2);
  height: var(--th);
  padding: 0 6px;
  gap: 3px;
  font-size: 10px;
}

/* 큰 PC 모니터(마우스 사용 + 넓은 화면)에서만: 레인이 화면 높이를 채우도록 말·이름표·번호판을 키움.
   스마트폰·태블릿(터치)은 이 규칙이 적용되지 않음 */
.arena.full.big.landscape .lanes { padding-left: 54px; padding-right: 16px; }
.arena.full.big.landscape .lanes::before { left: 50px; width: 3px; }
.arena.full.big.landscape .lanes::after { width: 16px; background-size: 16px 16px; }
.arena.full.big.landscape .numbadge { left: -48px; width: 38px; height: 38px; border-radius: 10px; font-size: 21px; }
.arena.full.big.landscape .tag { padding: 0 12px; gap: 6px; font-size: clamp(11px, calc(var(--th) * 0.5), 20px); }
/* 레인이 높아도 말과 이름표가 레인 세로 가운데(번호판 높이)에 오도록 */
.arena.full.big.landscape .lane .horse { bottom: calc((var(--lh) - var(--hw) * 0.6667) / 2); }
.arena.full.big.landscape .lane .tag { top: calc(var(--lh) / 2 - var(--th) / 2); }
.arena.full.big.landscape .rk { font-size: clamp(10px, calc(var(--th) * 0.42), 16px); }
/* 경주 종료 후 전체화면(가로) 동안에는 다시 시작 버튼을 숨김 (세로 복귀 후 다시 표시) */
.arena.full .startbtn, .arena.full .dhbtn { display: none; }

/* 세로 화면에서 시작하면 경주장을 시계방향 90도 돌려 가로 모드로 보여줌.
   회전 전 기준 너비 = 화면 높이, 높이 = 화면 너비. 화면 가운데를 축으로 돌림 (크기·위치는 JS가 지정) */
.arena.full.rot {
  inset: auto;
  top: 0;
  left: 0;
  transform-origin: 50% 50%;
  transform: rotate(90deg);
  animation: none;
}
/* 폰을 반대쪽(시계방향)으로 눕혔으면 반시계방향 90도로 돌려 경주장이 거꾸로 보이지 않게 함 */
.arena.full.rot.ccw { transform: rotate(-90deg); }
/* 경주 도중 방향이 바뀌면 반 바퀴 부드럽게 회전 (처음 전체화면에 들어갈 때는 바로 표시) */
.arena.full.rot.rotanim { transition: transform 0.6s cubic-bezier(0.45, 0, 0.2, 1); }
/* 회전하는 동안 모서리 뒤로 원래 페이지가 비치지 않도록 뒤를 하늘색으로 덮음 */
body.fullrace::before { content: ""; position: fixed; inset: 0; z-index: 99; background: linear-gradient(180deg, var(--sky-a), var(--sky-b)); }

/* 가로 전체화면에서는 시상대를 조금 낮춤 */
.arena.full.landscape .winner { width: min(100%, 420px); padding-top: 8px; }
.arena.full.landscape .p1 .pstep { height: 46px; }
.arena.full.landscape .p2 .pstep { height: 32px; }
.arena.full.landscape .p3 .pstep { height: 22px; font-size: 16px; }
.arena.full.landscape .horse.phorse { width: 40px; }
.arena.full.landscape .p1 .horse.phorse { width: 54px; }

@keyframes arenaIn { from { opacity: 0.4; transform: scale(0.96); } to { opacity: 1; transform: none; } }

/* ---------- 8. 경주 연출: 관중석 배경 · 흙먼지 · 슬로모션 ---------- */
/* 경주로 위 관중석 띠: 하늘·구름·언덕·관중석(관중 2겹)·광고판 펜스. 경주 중에는 서로 다른 속도로 흐르고 관중이 들썩임 */
.scenery {
  position: relative;
  flex: none;
  height: var(--scn, 64px);
  margin: 0 0 6px;
  overflow: hidden;
  border: 2px solid rgba(0, 0, 0, 0.2);
  border-radius: 12px;
  background: linear-gradient(180deg, #6EC3F0 0%, #BFE9FA 58%, #7CC98A 58%, #3E9A58 100%);
  box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.12);
}
@media (min-width: 560px) { .scenery { --scn: 84px; } }
.arena.full .scenery { height: var(--scn, 40px); }
.sc { position: absolute; left: 0; right: 0; background-repeat: repeat-x; background-size: auto 100%; }
.sc-sun { top: 6%; right: 8%; left: auto; width: 14%; height: 40%; background: radial-gradient(circle, #FFF6B0 0 30%, rgba(255, 240, 150, 0.5) 34%, transparent 62%); }
.sc-cloud { top: 2%; height: 36%; }
.sc-hill { bottom: 24%; height: 36%; }
.sc-stand, .sc-crowd { bottom: 22%; height: 76%; }
.sc-fence { bottom: 0; height: 30%; }
.arena.cheer .sc-crowd.a { animation: hop 0.3s ease-in-out infinite alternate; }
.arena.cheer .sc-crowd.b { animation: hop 0.3s ease-in-out infinite alternate-reverse; }
@keyframes hop { from { transform: translateY(0); } to { transform: translateY(-5%); } }
/* 흙먼지·불꽃 잔상을 그리는 캔버스 (레인 안, 말 뒤) */
.fx { position: absolute; left: 0; top: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
/* 막판 슬로모션: 화면 가장자리가 어두워지고 다리 움직임도 느려짐 */
.slowfx { position: absolute; inset: 0; z-index: 2; pointer-events: none; opacity: 0; transition: opacity 0.25s ease; background: radial-gradient(ellipse at 60% 50%, transparent 50%, rgba(0, 0, 0, 0.5) 100%); }
.stage.slow .slowfx { opacity: 1; }
.stage.slow .running .leg, .stage.slow .running .low { animation-duration: 1.15s; }
.stage.slow .running .tail { animation-duration: 0.6s; }
.stage.slow .running .jockey { animation-duration: 0.58s; }

/* ---------- 9. 움직임 줄이기 설정 ---------- */
@media (prefers-reduced-motion: reduce) {
  .slowfx { transition: none; }
  .arena.full { animation: none; }
  .arena.full.rot.rotanim { transition: none; }

  .startbtn:not(:disabled), .arena.cheer .sc-crowd, .chip { animation: none; }
  .lanes { transition: none; }
  .res, .rk { animation: none; }
}

<script>
/* =====================================================================
   목차
   1. 설정값 · 화면 요소
   2. 경주 연출 (관중석 배경 · 흙먼지 · 불꽃 잔상)
   3. 효과음
   4. 말 그림 · 색상
   5. 참가자 목록 · 화면 상태 · 시상대 · 판독 사진
   6. 경주로 배치 · 전체화면 · 화면 켜짐 유지

   9. 버튼 · 입력 처리 · 시작
   ===================================================================== */
(() => {
  /* ---------- 1. 설정값 · 화면 요소 ---------- */
  const MIN = 2, MAX = 8;
  const PALETTE = ['#E53935', '#2F7DF0', '#18A957', '#F59E0B', '#8E44C9', '#E8579A', '#12B5C9', '#D4D91C'];
  const MEDAL = ['🥇', '🥈', '🥉'];
  const SAMPLES = ['적토', '번개', '질풍', '천둥', '태풍', '불꽃', '유성', '은하', '흑풍', '백운', '청룡', '비호'];

  const $ = id => document.getElementById(id);
  const form = $('addForm'), input = $('nameInput'), addBtn = $('addBtn'), resetBtn = $('resetBtn');
  const sampleBtn = $('sampleBtn'), soundBtn = $('soundBtn'), startBtn = $('startBtn'), dhBtn = $('dhBtn');
  let darkHorse = false; /* 다크호스 모드: 켜져 있을 때만 경주 중 폭주하는 말이 나옴 */
  const badgeEl = $('badge'), msgEl = $('msg'), rosterEl = $('roster'), countEl = $('count');
  const stageEl = $('stage'), lanesEl = $('lanes'), ctaEl = $('cta'), podiumEl = $('podium');
  const liveEl = $('liveBadge'), statusEl = $('status'), clockEl = $('clock'), stateEl = $('resState');
  const resultsEl = $('results'), emptyEl = $('resultEmpty'), cdEl = $('countdown');
  const stiEl = $('sti'), sttEl = $('stt');
  const winnerEl = $('winner'), confettiEl = $('confetti'), pfotoEl = $('pfoto');
  let pfSnap = null; /* 1위가 결승선을 지나는 순간 모든 말의 위치 */
  const arenaEl = $('arena'), slotEl = $('arenaSlot');
  const sceneryEl = $('scenery'), scLayers = sceneryEl.querySelectorAll('.sc[data-sp]');
  const RM = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

  /* ---------- 2. 경주 연출 (흐르는 배경 · 흙먼지 · 불꽃 잔상) ---------- */

  /* ---------- 2. 경주 연출 (관중석 배경 · 흙먼지 · 불꽃 잔상) ---------- */
  const svgURI = str => 'url("data:image/svg+xml,' + encodeURIComponent(str) + '")';
  (function buildScenery() {
    const NS = "xmlns='http://www.w3.org/2000/svg'";
    const q = sceneryEl.querySelector.bind(sceneryEl);
    /* 구름 */
    const cloud = '<svg ' + NS + " viewBox='0 0 320 60'><g fill='#fff' opacity='0.95'>" +
      "<ellipse cx='52' cy='34' rx='28' ry='11'/><ellipse cx='70' cy='26' rx='18' ry='12'/><ellipse cx='38' cy='28' rx='14' ry='9'/>" +
      "<ellipse cx='214' cy='20' rx='22' ry='8'/><ellipse cx='228' cy='14' rx='13' ry='8'/><ellipse cx='200' cy='17' rx='10' ry='6'/></g>" +
      "<g fill='#DCEFF8'><ellipse cx='56' cy='40' rx='22' ry='4'/><ellipse cx='216' cy='25' rx='16' ry='3'/></g></svg>";
    /* 먼 언덕 (관중석 사이로 보임) */
    const hill = '<svg ' + NS + " viewBox='0 0 300 40' preserveAspectRatio='none'>" +
      "<path d='M0 40 L0 22 C40 6 80 6 120 20 C160 32 200 4 250 14 C275 19 290 24 300 22 L300 40 Z' fill='#9AD3A0'/>" +
      "<path d='M0 40 L0 30 C50 18 90 24 140 30 C190 36 240 18 300 30 L300 40 Z' fill='#6DBB7C'/></svg>";
    /* 관중석 건물: 줄무늬 차양 지붕 · 깃발 · 계단식 좌석 · 기둥, 오른쪽 빈자리에는 나무와 깃대 */
    let roof = '';
    for (let x = 0; x < 150; x += 10) roof += "<rect x='" + x + "' y='10' width='10' height='8' fill='" + ((x / 10) % 2 ? '#FFFFFF' : '#E53950') + "'/>";
    for (let x = 5; x < 150; x += 10) roof += "<circle cx='" + x + "' cy='18' r='5' fill='" + (((x - 5) / 10) % 2 ? '#FFFFFF' : '#E53950') + "'/>";
    const FLAG = ['#FFC62F', '#2F7DF0', '#18A957', '#E8579A'];
    let flags = '';
    [14, 52, 98, 136].forEach((x, k) => {
      flags += "<rect x='" + x + "' y='0' width='1.2' height='11' fill='#E8EEF6'/>" +
        "<path d='M" + (x + 1.2) + " 0.5 L" + (x + 9) + " 3 L" + (x + 1.2) + " 5.5 Z' fill='" + FLAG[k] + "'/>";
    });
    let seats = '';
    [24, 35, 46, 57].forEach(y => { seats += "<rect x='0' y='" + y + "' width='150' height='2.4' fill='#7F8EAA'/>"; });
    const stand = '<svg ' + NS + " viewBox='0 0 200 80'>" +
      "<rect x='0' y='18' width='150' height='56' fill='#4C5A78'/>" +
      "<rect x='0' y='18' width='150' height='6' fill='#3A4662'/>" + seats +
      "<rect x='3' y='18' width='3' height='56' fill='#2E3A55'/><rect x='73' y='18' width='3' height='56' fill='#2E3A55'/><rect x='144' y='18' width='3' height='56' fill='#2E3A55'/>" +
      "<rect x='-2' y='8' width='154' height='3' fill='#B5122E'/>" + roof + flags +
      "<rect x='0' y='68' width='150' height='12' fill='#2B354D'/><rect x='0' y='68' width='150' height='1.6' fill='#E8EEF6'/>" +
      "<rect x='171' y='56' width='4' height='24' fill='#7A4E2D'/>" +
      "<circle cx='173' cy='50' r='11' fill='#2F8F4E'/><circle cx='166' cy='56' r='7' fill='#3BA35C'/><circle cx='180' cy='55' r='8' fill='#287F45'/>" +
      "<rect x='192' y='14' width='1.4' height='66' fill='#E8EEF6'/><path d='M193.4 15 L200 18 L193.4 21 Z' fill='#E53950'/>" +
      '</svg>';
    /* 관중: 두 겹(A·B)으로 나눠 번갈아 들썩이게 함. 일부는 팔을 들거나 응원 깃발을 흔듦 */
    let seed = 7;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const SHIRT = ['#E53935', '#2F7DF0', '#FFC62F', '#18A957', '#E8579A', '#8E44C9', '#FFFFFF', '#12B5C9', '#F59E0B', '#FF7A45'];
    const SKIN = ['#F2C9A0', '#E0AC7E', '#8D5A3B', '#F7D7B5', '#C98E62'];
    const HAIR = ['#2B2328', '#5A3A22', '#1C1C1C', '#8A5A2B', '#D9B26A'];
    const crowd = ['', ''];
    let idx = 0;
    [30, 41, 52, 63].forEach((y, row) => {
      for (let x = 7 + (row % 2) * 4; x < 146; x += 8) {
        const sh = SHIRT[Math.floor(rnd() * SHIRT.length)], sk = SKIN[Math.floor(rnd() * SKIN.length)];
        const hr = HAIR[Math.floor(rnd() * HAIR.length)], pose = rnd();
        let p = '';
        if (pose < 0.28) {
          p += "<path d='M" + (x - 2.4) + ' ' + (y - 0.5) + ' L' + (x - 4.6) + ' ' + (y - 7) + "' stroke='" + sh + "' stroke-width='1.6' stroke-linecap='round'/>" +
               "<path d='M" + (x + 2.4) + ' ' + (y - 0.5) + ' L' + (x + 4.6) + ' ' + (y - 7) + "' stroke='" + sh + "' stroke-width='1.6' stroke-linecap='round'/>" +
               "<circle cx='" + (x - 4.7) + "' cy='" + (y - 7.4) + "' r='1' fill='" + sk + "'/><circle cx='" + (x + 4.7) + "' cy='" + (y - 7.4) + "' r='1' fill='" + sk + "'/>";
        } else if (pose < 0.38) {
          const fc = FLAG[Math.floor(rnd() * FLAG.length)];
          p += "<path d='M" + (x + 2.4) + ' ' + (y - 0.5) + ' L' + (x + 3.8) + ' ' + (y - 9) + "' stroke='#E8EEF6' stroke-width='0.8'/>" +
               "<path d='M" + (x + 3.8) + ' ' + (y - 9) + ' L' + (x + 9) + ' ' + (y - 7.5) + ' L' + (x + 3.6) + ' ' + (y - 5.5) + " Z' fill='" + fc + "'/>";
        }
        p += "<ellipse cx='" + x + "' cy='" + (y + 2.4) + "' rx='3.5' ry='3.2' fill='" + sh + "'/>" +
             "<circle cx='" + x + "' cy='" + (y - 2.6) + "' r='2.4' fill='" + sk + "'/>" +
             "<path d='M" + (x - 2.4) + ' ' + (y - 2.8) + ' A2.4 2.4 0 0 1 ' + (x + 2.4) + ' ' + (y - 2.8) + " Z' fill='" + hr + "'/>";
        crowd[idx++ % 2] += p;
      }
      idx++;
    });
    const crowdSVG = s => '<svg ' + NS + " viewBox='0 0 200 80'>" + s + '</svg>';
    /* 광고판 펜스 */
    const fence = '<svg ' + NS + " viewBox='0 0 200 30'>" +
      "<rect x='2' y='8' width='94' height='17' rx='2' fill='#0E8A52'/><rect x='104' y='8' width='94' height='17' rx='2' fill='#0E66B8'/>" +
      "<text x='49' y='20.5' text-anchor='middle' font-family='sans-serif' font-weight='900' font-size='10' fill='#FFE45C'>RACE DAY</text>" +
      "<text x='151' y='20.5' text-anchor='middle' font-family='sans-serif' font-weight='900' font-size='10' fill='#FFFFFF'>GO! GO!</text>" +
      "<rect x='0' y='3' width='200' height='3.4' fill='#FFFFFF'/><rect x='0' y='6.4' width='200' height='1' fill='#C9D2DE'/>" +

    q('.sc-cloud').style.backgroundImage = svgURI(cloud);
    q('.sc-hill').style.backgroundImage = svgURI(hill);
    q('.sc-hill').style.backgroundSize = '300px 100%';
    q('.sc-stand').style.backgroundImage = svgURI(stand);
    q('.sc-crowd.a').style.backgroundImage = svgURI(crowdSVG(crowd[0]));

  })();
  /* 배경 흐름: 구름은 천천히, 언덕·관중석은 중간, 펜스는 빠르게 */
  let scX = 0;
  const SC_BASE = 50.7;              /* 관중석 기준 흐름 속도(px/초, 띠 높이 40px 기준) */
  const SC_SPEED = Array.from(scLayers, el => Number(el.dataset.sp) || 1);
  function scrollScenery(dt, k) {
