<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#12A15F"><meta name="apple-mobile-web-app-title" content="경마 레이스"></head><body>
<title>경마 레이스</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 둥근 하늘색 무대 카드 한 장 안에 위에서 아래로 배지·제목 → 입력 카드 → LIVE 바 → 초록 테두리 흙길 경주로 → 메달 순위표. */
:root {
  --page: #F4F6F9;
  --sky-a: #D6EFF8;
  --sky-b: #DCF6E7;
  --sky-line: #C7E7EE;
  --fg: #1B2433;
  --muted: #526076;
  --title: #0E5A3A;
  --title-shadow: 0 2px 0 rgba(255, 255, 255, 0.75);
  --card: #FFFFFF;
  --card-line: #BDEADB;
  --field: #FFFFFF;
  --field-line: #C3D2E3;
  --chip: #FFFFFF;
  --pill-bg: #F1F5FA;
  --pill-line: #D3DDE8;
  --blue: #0E96DC;
  --blue-deep: #0A6FA3;
  --grey-btn: #E4E8EF;
  --grey-deep: #C0C8D6;
  --grey-fg: #3B465A;
  --green: #12A15F;
  --green-deep: #0A7444;
  --green-solid: #0E8A52;
  --green-text: #0A7444;
  --badge: #FFC62F;
  --badge-fg: #5A3A00;
  --navy: #12183A;
  --navy-line: #232A57;
  --live: #FF6B88;
  --live-bg: #54152C;
  --cyan: #5EE6D2;
  --yellow-text: #FFD54A;
  --dirt: #9C6B49;
  --dirt-line: rgba(255, 255, 255, 0.38);
  --frame: #0D7A55;
  --edge: #86380F;
  --res-line: #FFD64F;
  --res-tint: #FFFBEA;
  --row-bg: #FFFFFF;
  --row-line: #E1E7EF;
  --gold-bg: #FFF3BA;
  --gold-line: #F2B71F;
  --silver-bg: #EEF1F9;
  --silver-line: #A3ADCB;
  --bronze-bg: #FFF1E1;
  --bronze-line: #F4B27A;
  --medal-gold: #F5A21B;
  --medal-gold-fg: #4A2C00;
  --medal-silver: #5F6C87;
  --medal-bronze: #C8400B;
  --medal-navy: #1F2A47;
  --st-wait-bg: #EEF2F7;
  --st-wait-fg: #4C586E;
  --st-run-bg: #FFEFBD;
  --st-run-fg: #7A4B00;
  --st-done-bg: #D6F5E4;
  --st-done-fg: #0A6F42;
  --danger: #C62F2F;
  --focus: #2F6FEB;
  --font-display: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-body: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --hw: 62px;
  --lh: 70px;
  --th: 20px;
}
@media (min-width: 560px) {
  :root { --hw: 88px; --lh: 88px; --th: 22px; }
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0A0F1A;
    --sky-a: #10283C;
    --sky-b: #10332E;
    --sky-line: #1E4A55;
    --fg: #E8EEF8;
    --muted: #A5B3C9;
    --title: #8FE9BC;
    --title-shadow: none;
    --card: #162033;
    --card-line: #285A58;
    --field: #0F1727;
    --field-line: #33445F;
    --chip: #1B2840;
    --pill-bg: #1B2840;
    --pill-line: #33445F;
    --blue: #1597DC;
    --blue-deep: #0B5F8E;
    --grey-btn: #2B3850;
    --grey-deep: #1A2336;
    --grey-fg: #E1E8F4;
    --green-solid: #0F8F55;
    --green-text: #7CE3AE;
    --navy: #0B1030;
    --frame: #0B6A49;
    --edge: #6D2D0B;
    --res-line: #B88A12;
    --res-tint: #1B2438;
    --row-bg: #1B2840;
    --row-line: #2C3B57;
    --gold-bg: #3B3216;
    --gold-line: #C79A1B;
    --silver-bg: #252E46;
    --silver-line: #6C7AA3;
    --bronze-bg: #3A281C;
    --bronze-line: #B8743F;
    --st-wait-bg: #243149;
    --st-wait-fg: #B4C1D6;
    --st-run-bg: #4A3A0F;
    --st-run-fg: #FFD875;
    --st-done-bg: #11402D;
    --st-done-fg: #8CE9B9;
    --danger: #FF8A8A;
    --focus: #7AA2FF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #0A0F1A;
  --sky-a: #10283C;
  --sky-b: #10332E;
  --sky-line: #1E4A55;
  --fg: #E8EEF8;
  --muted: #A5B3C9;
  --title: #8FE9BC;
  --title-shadow: none;
  --card: #162033;
  --card-line: #285A58;
  --field: #0F1727;
  --field-line: #33445F;
  --chip: #1B2840;
  --pill-bg: #1B2840;
  --pill-line: #33445F;
  --blue: #1597DC;
  --blue-deep: #0B5F8E;
  --grey-btn: #2B3850;
  --grey-deep: #1A2336;
  --grey-fg: #E1E8F4;
  --green-solid: #0F8F55;
  --green-text: #7CE3AE;
  --navy: #0B1030;
  --frame: #0B6A49;
  --edge: #6D2D0B;
  --res-line: #B88A12;
  --res-tint: #1B2438;
  --row-bg: #1B2840;
  --row-line: #2C3B57;
  --gold-bg: #3B3216;
  --gold-line: #C79A1B;
  --silver-bg: #252E46;
  --silver-line: #6C7AA3;
  --bronze-bg: #3A281C;
  --bronze-line: #B8743F;
  --st-wait-bg: #243149;
  --st-wait-fg: #B4C1D6;
  --st-run-bg: #4A3A0F;
  --st-run-fg: #FFD875;
  --st-done-bg: #11402D;
  --st-done-fg: #8CE9B9;
  --danger: #FF8A8A;
  --focus: #7AA2FF;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { scrollbar-gutter: stable; }
body {
  margin: 0;
  background: var(--page);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  word-break: keep-all;
  overflow-wrap: anywhere;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.app { max-width: 620px; margin: 0 auto; }
.stage-card {
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding: 22px 14px 24px;
  border: 1px solid var(--sky-line);
  border-radius: 30px;
  background: linear-gradient(180deg, var(--sky-a), var(--sky-b));
  min-width: 0;
}
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.hero { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.badge {
  display: inline-block;
  padding: 6px 16px;
  border-radius: 999px;
  background: var(--badge);
  color: var(--badge-fg);
  font-size: 14px;
  font-weight: 700;
  box-shadow: 0 2px 0 rgba(90, 58, 0, 0.18);
}
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(28px, 8.4vw, 42px);
  line-height: 1.15;
  color: var(--title);
  text-shadow: var(--title-shadow);
  text-wrap: balance;
}
.sub { margin: 0; max-width: 34ch; color: var(--muted); font-size: 14px; text-wrap: balance; }

.card {
  min-width: 0;
  padding: 18px 16px;
  border: 2px solid var(--card-line);
  border-radius: 26px;
  background: var(--card);
  box-shadow: 0 6px 18px rgba(20, 120, 110, 0.12);
}
.setup h2 { margin: 0 0 12px; font-size: 16px; font-weight: 700; }
.cnt { color: var(--green-text); }
input[type="text"] {
  width: 100%;
  height: 52px;
  padding: 0 16px;
  border: 2px solid var(--field-line);
  border-radius: 16px;
  background: var(--field);
  color: var(--fg);
  font: inherit;
  font-size: 16px;
}
input[type="text"]::placeholder { color: var(--muted); opacity: 0.8; }
input[type="text"]:disabled { opacity: 0.55; }
.btnrow { display: grid; grid-template-columns: 1.15fr 1fr; gap: 12px; margin-top: 12px; padding-bottom: 5px; }
.b3d {
  height: 52px;
  min-width: 0;
  border: 0;
  border-radius: 16px;
  font: inherit;
  font-size: 17px;
  font-weight: 700;
  color: #fff;
  cursor: pointer;
  box-shadow: 0 5px 0 var(--deep);
  transition: transform 0.08s ease, box-shadow 0.08s ease;
}
.b3d:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--deep); }
.b3d:disabled { opacity: 0.5; cursor: not-allowed; }
.b3d.blue { background: var(--blue); --deep: var(--blue-deep); }
.b3d.grey { background: var(--grey-btn); color: var(--grey-fg); --deep: var(--grey-deep); }

.dur {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 10px;
  margin-top: 14px;
  padding: 8px 10px;
  border: 1.5px solid var(--pill-line);
  border-radius: 20px;
  background: var(--pill-bg);
}
.durlabel { flex: none; font-size: 13px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.seg { flex: 1; min-width: 190px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.seg label { position: relative; display: block; min-width: 0; }
.seg span {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 36px;
  border: 1.5px solid var(--pill-line);
  border-radius: 999px;
  background: var(--card);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
}
.seg input:checked + span { background: var(--green-solid); border-color: var(--green-solid); color: #fff; }
.seg input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 2px; }
.seg input:disabled + span { opacity: 0.5; cursor: not-allowed; }

.msg { min-height: 20px; margin: 6px 0 0; color: var(--danger); font-size: 13px; font-weight: 500; }
.tools {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 4px 0 16px;
  border-bottom: 1.5px solid var(--pill-line);
  color: var(--muted);
  font-size: 13px;
}
.textbtn {
  flex: 1 1 140px;
  min-width: 0;
  height: 52px;
  padding: 0 8px;
  white-space: nowrap;
  border: 2px solid var(--pill-line);
  border-radius: 999px;
  background: var(--pill-bg);
  color: var(--fg);
  font: inherit;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}
.textbtn#sampleBtn, #soundBtn { flex: 1 1 0; }
.textbtn:active:not(:disabled) { transform: translateY(1px); }
.textbtn:disabled { opacity: 0.45; cursor: not-allowed; }
/* 효과음: 켜짐은 노란색, 꺼짐은 옅은 회색 */
#soundBtn[aria-pressed="true"] { background: var(--badge); border-color: var(--badge); color: var(--badge-fg); }
#soundBtn[aria-pressed="false"] { background: var(--grey-btn); border-color: var(--grey-btn); color: var(--muted); }
.roster { list-style: none; margin: 14px 0 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.chip {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  padding: 7px 8px 7px 14px;
  border: 2.5px solid var(--c);
  border-radius: 999px;
  background: var(--chip);
  font-weight: 700;
}
.dot { width: 14px; height: 14px; border-radius: 50%; flex: none; }
.cname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.x { flex: none; width: 26px; height: 26px; border: 0; border-radius: 50%; background: var(--pill-bg); color: var(--muted); font-size: 17px; line-height: 1; cursor: pointer; }
.x:hover:not(:disabled) { background: var(--pill-line); color: var(--fg); }
.x:disabled { opacity: 0.35; cursor: not-allowed; }
.roster-empty { grid-column: 1 / -1; padding: 14px; border: 1.5px dashed var(--pill-line); border-radius: 16px; color: var(--muted); font-size: 14px; text-align: center; }

.live {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  padding: 12px 14px;
  min-height: 68px;
  border: 3px solid var(--navy-line);
  border-radius: 20px;
  background: var(--navy);
}
.livebadge { flex: none; padding: 5px 10px; border-radius: 8px; background: var(--live-bg); color: var(--live); font-size: 12px; font-weight: 900; letter-spacing: 0.08em; }
.livebadge.on { background: #E11D48; color: #fff; animation: blink 1s ease-in-out infinite; }
@keyframes blink { 50% { opacity: 0.55; } }
.status { flex: 1; min-width: 0; display: flex; align-items: flex-start; gap: 6px; color: var(--yellow-text); font-size: 14px; font-weight: 700; line-height: 1.3; }
.sti { flex: none; width: 1.5em; text-align: center; }
.stt { flex: 1; min-width: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.clockpill {
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-width: 100px;
  padding: 7px 12px;
  border: 1.5px solid #3A4380;
  border-radius: 999px;
  background: #1A2150;
  color: var(--cyan);
  font-size: 15px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.trackframe { padding: 10px 10px 12px; border: 6px solid var(--edge); border-radius: 26px; background: var(--frame); min-width: 0; }
.thead { display: flex; justify-content: space-between; gap: 6px; padding: 2px 4px 8px; color: #fff; font-size: 12px; font-weight: 700; white-space: nowrap; }
.stage {
  position: relative;
  overflow: hidden;
  border: 2px solid rgba(0, 0, 0, 0.22);
  border-radius: 14px;
  background:
    repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.05) 0 2px, transparent 2px 16px),
    linear-gradient(180deg, rgba(255, 255, 255, 0.07), rgba(0, 0, 0, 0.1)),
    var(--dirt);
}
.stage.idle .lanes { filter: grayscale(1); }
.lanes { position: relative; padding: 6px 14px 6px 52px; transition: filter 0.4s ease; }
.lanes::before { content: ""; position: absolute; left: 48px; top: 0; bottom: 0; width: 3px; background: rgba(255, 255, 255, 0.85); }
.lanes::after {
  content: "";
  position: absolute;
  right: 0; top: 0; bottom: 0;
  width: 14px;
  background: repeating-conic-gradient(#F4F5F7 0% 25%, #15171D 0% 50%) 0 0 / 14px 14px;
}
.lane { position: relative; height: var(--lh); }
.lane + .lane { border-top: 2px dashed var(--dirt-line); }
.numbadge {
  position: absolute;
  left: -46px;
  top: 50%;
  transform: translateY(-50%);
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border-radius: 10px;
  font-family: var(--font-display);
  font-size: 18px;
  box-shadow: 0 2px 0 rgba(0, 0, 0, 0.28);
}
.numbadge.bump { animation: bump 0.25s ease-out; }
@keyframes bump { 0% { transform: translateY(-50%) scale(1.3); } 100% { transform: translateY(-50%) scale(1); } }
.lanes-empty { min-height: 160px; display: grid; place-items: center; padding: 14px 16px; margin-left: -34px; color: rgba(255, 255, 255, 0.92); font-size: 14px; font-weight: 500; text-align: center; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35); }

.cta { position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 12px; pointer-events: none; }
.cta > * { pointer-events: auto; }
.startbtn {
  min-width: 200px;
  height: 60px;
  padding: 0 32px;
  border: 4px solid #fff;
  border-radius: 999px;
  background: var(--green);
  color: #fff;
  font-family: var(--font-display);
  font-size: 24px;
  cursor: pointer;
  box-shadow: 0 8px 18px rgba(0, 0, 0, 0.3);
  transition: transform 0.1s ease;
}
.startbtn:active:not(:disabled) { transform: scale(0.97); }
.startbtn:disabled { background: #7D8A99; cursor: not-allowed; }
/* 다크호스 모드(폭주 기능) 켜고 끄기 */
.dhbtn { min-width: 200px; height: 40px; padding: 0 20px; border: 3px solid #fff; border-radius: 999px; background: #3A4150; color: #D5DAE3; font-family: var(--font-display); font-size: 16px; cursor: pointer; box-shadow: 0 6px 14px rgba(0, 0, 0, 0.28); transition: transform 0.1s ease, background 0.15s; }
.dhbtn[aria-pressed="true"] { background: linear-gradient(90deg, #2A1A3A, #5A1E1E); color: #FFD27A; box-shadow: 0 0 0 2px #FF7A1A, 0 6px 16px rgba(255, 90, 20, 0.45); }
.dhbtn:active:not(:disabled) { transform: scale(0.97); }

.countdown { position: absolute; inset: 0; z-index: 4; display: grid; place-items: center; pointer-events: none; }
.countdown span {
  display: grid;
  place-items: center;
  width: 112px;
  height: 112px;
  border: 5px solid #fff;
  border-radius: 50%;
  background: var(--green);
  color: #fff;
  font-family: var(--font-display);
  font-size: 62px;
  line-height: 1;
  box-shadow: 0 8px 18px rgba(0, 0, 0, 0.32);
  animation: cdpop 0.5s ease-out;
}
.countdown span.go { width: 128px; height: 128px; background: #E11D48; font-size: 38px; }
@keyframes cdpop { from { transform: scale(1.7); opacity: 0; } 60% { opacity: 1; } to { transform: scale(1); opacity: 1; } }

.stage.done .lanes { min-height: 290px; display: flex; flex-direction: column; justify-content: center; }
/* 전체화면 경주 중에는 우승 표시가 나와도 말 위치가 밀리지 않도록 높이를 늘리지 않음 */
.arena.full .stage.done .lanes { min-height: 0; }
.lane { flex: none; }
.winner {
  width: min(100%, 340px);
  padding: 10px 10px 0;
  border: 4px solid var(--gold-line);
  border-radius: 28px;
  background: radial-gradient(120% 90% at 50% 0%, var(--gold-bg), var(--card) 72%);
  box-shadow: 0 12px 27px rgba(0, 0, 0, 0.3);
  overflow: hidden;
  animation: drop 0.55s cubic-bezier(0.2, 1.4, 0.4, 1);
}
/* 시상대: 가운데 1위(가장 높음), 왼쪽 2위, 오른쪽 3위. 각 단 위에 말이 서고 그 위에 이름표 */
.podium { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1.2fr 1fr; align-items: end; }
.podium.two { grid-template-columns: 1fr 1.2fr; }
.podium li { min-width: 0; display: flex; flex-direction: column; align-items: center; animation: stepUp 0.5s cubic-bezier(0.2, 1.2, 0.4, 1) backwards; }
.podium .p1 { order: 2; animation-delay: 0.55s; }
.podium .p2 { order: 1; animation-delay: 0.35s; }
.podium .p3 { order: 3; animation-delay: 0.15s; }
@keyframes stepUp { from { transform: translateY(110%); } to { transform: none; } }
.p1::before { content: "👑"; font-size: 18px; line-height: 1; margin-bottom: 1px; }
.pname {
  max-width: calc(100% - 6px);
  padding: 2px 8px 4px;
  border-radius: 999px;
  background: var(--pc, var(--green));
  color: var(--pt, #fff);
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 16px;
  line-height: 1.25;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  box-shadow: 0 2px 0 rgba(0, 0, 0, 0.18);
}
.p1 .pname { padding: 2px 12px 5px; font-size: 24px; }

      const hp = a.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 5500;
      const cg = a.createGain(); cg.gain.setValueAtTime(0.3, c); cg.gain.exponentialRampToValueAtTime(0.001, c + 1.5);
      src.connect(hp); hp.connect(cg); cg.connect(a.destination); src.start(c);
    } catch (e) { /* 소리 재생 실패는 무시 */ }
  };
  const sfx = {
    add: () => tone(660, 0.09, 'triangle', 0.1),
    tick: () => tone(880, 0.12, 'square', 0.06),
    pop: () => popSound(),
    start: () => gunshot(),
    cross: rank => tone(Math.max(520, 1175 - (rank - 1) * 95), 0.16, 'triangle', 0.09),
    end: () => fanfare()
  };

  /* 말 색상 위에서 읽히는 글자색 (WCAG 대비가 큰 쪽) */
  const lin = v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
  const textOn = hex => {
    const n = parseInt(hex.slice(1), 16);
    const L = 0.2126 * lin(n >> 16) + 0.7152 * lin((n >> 8) & 255) + 0.0722 * lin(n & 255);
    return 1.05 / (L + 0.05) >= (L + 0.05) / 0.06 ? '#FFFFFF' : '#17191F';
  };

  const shade = d => '<path d="' + d + '"/><path class="shade" d="' + d + '"/>';
  const leg = (x, d) =>
    '<g class="leg" style="--d:' + d + 's;transform-origin:' + x + 'px 36px">' +
      '<path d="M' + (x - 2.6) + ' 36 L' + (x + 2.6) + ' 36 L' + (x + 2) + ' 47 L' + (x - 2) + ' 47 Z"/>' +
      '<g class="low" style="transform-origin:' + x + 'px 47px">' +
        '<path d="M' + (x - 2) + ' 47 L' + (x + 2) + ' 47 L' + (x + 1.5) + ' 58 L' + (x - 1.5) + ' 58 Z"/>' +
        '<path class="hoof" d="M' + (x - 2.2) + ' 57.5 L' + (x + 2.2) + ' 57.5 L' + (x + 2.8) + ' 61 L' + (x - 2.8) + ' 61 Z"/>' +
      '</g></g>';
  const horseSVG = n =>
    '<svg viewBox="0 0 96 64" aria-hidden="true" focusable="false">' +
      '<g class="far">' + leg(34, 0) + leg(58, -0.23) + '</g>' +
      '<g class="tail" style="transform-origin:21px 28px">' +
        shade('M21 27 C12 23 5 28 4 38 C3 45 5 51 9 55 C9 47 11 41 17 37 C20 35 22 34 23 33 Z') + '</g>' +
      '<path d="M20 30 C20 23 30 21 42 22 C52 23 58 24 62 27 C66 30 67 37 63 41 C58 46 50 46 44 45 C36 45 28 46 23 42 C19 38 19 34 20 30 Z"/>' +
      '<path class="hi" d="M27 26 C35 23 48 23 58 26 C49 25 36 25 27 28 Z"/>' +
      '<path class="shade" d="M24 41 C32 46 52 47 62 41 C57 48 33 49 24 41 Z"/>' +
      '<path d="M56 25 C60 18 65 11 71 7 L79 12 C77 19 73 26 68 36 L62 38 Z"/>' +
      '<path d="M70 8 C74 4 78 5 80 8 L89 20 C91 23 89 27 85 27 C82 27 80 25 78 23 L72 16 Z"/>' +
      shade('M72 6 L74 0 L77 6 Z') +
      shade('M71 6 C66 8 61 15 57 24 L60 27 C64 20 69 14 75 10 Z') +
      shade('M75 5 L81 9 L77 12 Z') +
      '<path class="blaze" d="M79 10 C82 13 85 17 87 21 L85 22 C83 18 80 14 77 12 Z"/>' +
      '<circle class="eye" cx="77.8" cy="13" r="1.9"/><circle class="pupil" cx="78.2" cy="13.1" r="1"/><circle class="eye" cx="78.6" cy="12.6" r="0.35"/>' +
      '<circle class="pupil" cx="87.6" cy="23.2" r="0.9"/>' +
      '<rect class="cloth" x="37" y="24" width="13" height="12" rx="3"/>' +
      '<text class="num" x="43.5" y="33.3" text-anchor="middle">' + n + '</text>' +
      '<g>' + leg(28, -0.12) + leg(52, -0.35) + '</g>' +
    '</svg>';

  /* 폭주 불꽃: 말 SVG와 같은 좌표계(96x64)에서 등 위로 피어올라 뒤쪽으로 날리는 불길 */
  const tongue = (bx, by, w, h, cls, d) =>
    '<path class="' + cls + '" style="--d:' + d + 's" d="M' + (bx - w / 2) + ' ' + by +
    ' C' + (bx - w / 2) + ' ' + (by - h * 0.5) + ' ' + (bx - w * 0.3 - h * 0.25) + ' ' + (by - h * 0.72) + ' ' + (bx - h * 0.5) + ' ' + (by - h) +
    ' C' + (bx + w * 0.15) + ' ' + (by - h * 0.62) + ' ' + (bx + w / 2) + ' ' + (by - h * 0.45) + ' ' + (bx + w / 2) + ' ' + by + ' Z"/>';
  const flameSVG = () => {
    const spots = [[22, 34, 16, 26, -0.05], [34, 29, 16, 30, -0.11], [46, 28, 15, 27, 0], [57, 30, 13, 22, -0.08], [12, 40, 14, 18, -0.03]];
    let s = '<svg class="flame" viewBox="0 0 96 64" aria-hidden="true" focusable="false">';
    spots.forEach(([x, y, w, h, d]) => { s += tongue(x, y, w, h, 'f1', d); });
    spots.forEach(([x, y, w, h, d]) => { s += tongue(x + 1, y, w * 0.65, h * 0.68, 'f2', d - 0.04); });
    spots.forEach(([x, y, w, h, d]) => { s += tongue(x + 1.5, y, w * 0.35, h * 0.4, 'f3', d - 0.07); });
    return s + '</svg>';
  };

  const setMsg = t => { msgEl.textContent = t || ''; };
  const freeColor = () => {
    const used = players.map(p => p.color);
    return PALETTE.find(c => !used.includes(c)) || PALETTE[players.length % PALETTE.length];
  };
  const addPlayer = name => players.push({ id: nextId++, name, color: freeColor() });
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

  function renderRoster() {
    rosterEl.textContent = '';
    if (!players.length) {
      const li = document.createElement('li'); li.className = 'roster-empty';
      li.textContent = '아직 참가자가 없어요. 이름을 추가하거나 경주마 추가를 눌러 보세요.';
      rosterEl.appendChild(li);
    }
    players.forEach((p, i) => {
      const li = document.createElement('li'); li.className = 'chip'; li.style.setProperty('--c', p.color);
      const dot = document.createElement('span'); dot.className = 'dot'; dot.style.background = p.color;
      const nm = document.createElement('span'); nm.className = 'cname'; nm.textContent = p.name;
      const x = document.createElement('button'); x.type = 'button'; x.className = 'x'; x.textContent = '×';
      x.setAttribute('aria-label', p.name + ' 삭제'); x.disabled = racing || counting;
      x.addEventListener('click', () => removePlayer(p.id));
      li.append(dot, nm, x);
      rosterEl.appendChild(li);
    });
    countEl.textContent = '(' + players.length + ' / ' + MAX + '명)';
  }

  function updateHead() {
    badgeEl.textContent = '🏇 스릴 만점 ' + getDur() + '초 레이스';
    $('dist').textContent = (getDur() * 50).toLocaleString('en-US') + 'm';
  }

  function updateControls() {
    const busy = racing || counting;
    const full8 = players.length >= MAX;
    input.disabled = busy || full8;
    addBtn.disabled = busy || full8;
    input.placeholder = full8 ? '참가자 ' + MAX + '명이 모두 찼어요' : '이름을 입력하세요 (예: 홍길동)';
    resetBtn.disabled = busy;
    sampleBtn.disabled = busy || full8;
    durInputs.forEach(i => { i.disabled = busy; });
    ctaEl.hidden = busy || players.length === 0;
    stageEl.classList.toggle('idle', !busy && players.length > 0);
    startBtn.disabled = busy || players.length < MIN;
    dhBtn.disabled = busy;
    /* 다크호스 모드는 말이 4마리 이상일 때만 선택 가능 (폭주는 4위 이하 말 중에서 나옴) */
    dhBtn.hidden = players.length < 4;
    stageEl.classList.toggle('hasdh', !dhBtn.hidden);
    const showWin = !busy && hasRaced && finished.length > 0;
    stageEl.classList.toggle('done', showWin);
    winnerEl.hidden = !showWin;
    if (showWin) {
      podiumEl.textContent = '';
      const top = finished.slice(0, 3);
      podiumEl.classList.toggle('two', top.length === 2);
      top.forEach((p, k) => {
        const li = document.createElement('li'); li.className = 'p' + (k + 1);
        const nm = document.createElement('b'); nm.className = 'pname'; nm.textContent = p.name;
        nm.style.setProperty('--pc', p.color); nm.style.setProperty('--pt', textOn(p.color));
        const hs = document.createElement('div'); hs.className = 'horse phorse'; hs.style.color = p.color;
        hs.innerHTML = horseSVG(p.no);
        const st = document.createElement('span'); st.className = 'pstep'; st.textContent = k + 1;
        st.setAttribute('aria-label', (k + 1) + '위');
        li.append(nm, hs, st);
        podiumEl.appendChild(li);
      });
      fitWinner();
    }
    pfotoEl.hidden = !(showWin && finished.length >= 2);
    if (!pfotoEl.hidden) renderPhoto();
    startBtn.textContent = hasRaced ? '🏁 다시 시작' : '🏁 시작';
  }

  /* 결승 판독 사진: 1위가 결승선에 코를 댄 순간, 2위가 얼마나 뒤에 있었는지 */
  function renderPhoto() {
    const a = finished[0], b = finished[1];
    const dt = Math.max(0, b.time - a.time);
    let L = 0;
    if (pfSnap && pfSnap.hw > 0) {
      L = (1 - pfSnap.pos[b.no - 1]) * pfSnap.track / pfSnap.hw;
      if (!(L > 0.01)) L = dt / a.time * pfSnap.track / pfSnap.hw;
    }
    const HW = 64, off = Math.min(L * HW, 150);
    pfotoEl.textContent = '';
    const head = document.createElement('div'); head.className = 'pfhead';
    const ti = document.createElement('span'); ti.className = 'pftitle'; ti.textContent = '📸 PHOTO FINISH';
    const mg = document.createElement('span'); mg.className = 'pfmargin';
    mg.textContent = dt.toFixed(2) + '초 차';
    head.append(ti, mg);
    const img = document.createElement('div'); img.className = 'pfimg';
    const line = document.createElement('span'); line.className = 'pfline';
    img.appendChild(line);
    [a, b].forEach((p, k) => {
      const lane = document.createElement('div'); lane.className = 'pflane';
      const rk = document.createElement('span'); rk.className = 'pfrk'; rk.textContent = k + 1;
      const run = document.createElement('div'); run.className = 'pfrun';
      run.style.setProperty('--off', (k ? off : 0).toFixed(1) + 'px');
      const tag = document.createElement('span'); tag.className = 'pftag'; tag.textContent = p.name;
      tag.style.background = p.color; tag.style.color = textOn(p.color);
      const hs = document.createElement('div'); hs.className = 'horse pfh'; hs.style.color = p.color;
      hs.style.setProperty('--ph', (k ? 0.3 : 0.12) + 's');
      hs.innerHTML = horseSVG(p.no);
      run.append(tag, hs);
      const tm = document.createElement('span'); tm.className = 'pftime'; tm.textContent = p.time.toFixed(2) + '초';
      lane.append(rk, run, tm);
      img.appendChild(lane);
    });
    pfotoEl.append(head, img);
  }

  /* 이름이 길면 시상대 칸 안에 한 줄로 들어오도록 글자 크기를 줄임 (화면 크기가 바뀔 때마다 다시 계산) */
  function fitWinner() {
    if (winnerEl.hidden) return;
    podiumEl.querySelectorAll('.pname').forEach(el => {
      el.style.fontSize = '';
      let fs = parseFloat(getComputedStyle(el).fontSize) || 17;
      while (el.scrollWidth > el.clientWidth && fs > 9) { fs -= 1; el.style.fontSize = fs + 'px'; }
    });
  }

  /* 맨 앞 아이콘과 본문을 따로 두어, 줄이 바뀌어도 둘째 줄이 본문 첫 글자에 맞춰 정렬됨 */
  function putStatus(str) {
    const m = str.match(/^(\S+)\s+([\s\S]*)$/);
    const icon = m ? m[1] : '', tx = m ? m[2] : str;
    stiEl.textContent = icon; sttEl.textContent = tx; statusEl.title = tx;
  }

  function setStatus() {
    let s, st, label;
    if (counting) { s = '🎙️ 말들이 게이트에 들어섭니다!'; st = 'wait'; label = '대기 중'; }
    else if (racing) { s = '🏇 경주 중! 누가 먼저 들어올까?'; st = 'run'; label = '진행 중'; }
    else if (hasRaced && finished.length) {
      const w = finished[0];
      s = (midName && midName !== w.name) ? '🎊 짜릿한 역전승입니다! 우승 ' + w.name + '!' : '🏆 결승선 통과! 우승은 ' + w.name + '입니다!';
      st = 'done'; label = '경주 완료';
    }
    else { s = players.length < MIN ? '⏳ 참가자를 기다리는 중' : '🚦 ' + players.length + '명 출전 대기'; st = 'wait'; label = '대기 중'; }
    putStatus(s);
    stateEl.textContent = label; stateEl.className = 'state ' + st;
    liveEl.classList.toggle('on', racing);
  }

  function measure() {
    const lane = lanesEl.querySelector('.lane');
    if (!lane) { laneW = 0; hw = 0; return; }
    laneW = lane.clientWidth;
    hw = horseEls[0].offsetWidth;
    tagW = tagEls.map(t => t.offsetWidth);
    geo = horseEls.map((h, i) => ({ ox: laneEls[i].offsetLeft, oy: laneEls[i].offsetTop + h.offsetTop, hh: h.offsetHeight }));
    sizeFx();
  }

  function applyPos(t) {
    for (let i = 0; i < horseEls.length; i++) {
      const x = pos[i] * (laneW - hw);
      let amp = 1.3;
      if (doneAt[i] != null) amp *= Math.max(0, 1 - (t - doneAt[i]) / 0.5);
      const bob = racing && laneEls[i].classList.contains('running') ? Math.sin(t * 22 + i * 1.7) * amp : 0;
      horseEls[i].style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + bob.toFixed(2) + 'px,0)';
      /* 이름표는 말 몸통 위가 아니라 꼬리 쪽(진행 방향 뒤)에 배치합니다.
         출발 직후에는 뒤쪽 공간이 부족하므로 반대편으로 잠시 피하고,
         공간이 생기면 다시 꼬리 쪽으로 이동합니다. */
      const gap = Math.max(6, Math.round(hw * 0.08));
      const behindX = x - tagW[i] - gap;
      const aheadX = x + hw + gap;
      const tx = behindX >= 0
        ? behindX
        : clamp(aheadX, 0, Math.max(0, laneW - tagW[i]));
      tagEls[i].style.transform = 'translate3d(' + tx.toFixed(1) + 'px,0,0)';
    }
  }

  function buildLanes() {
    clearFx(); resetCam();
    lanesEl.textContent = '';
    fxCanvas = null; fxCtx = null; geo = []; ghostImg = [];
    laneEls = []; horseEls = []; tagEls = []; badgeEls = []; finRank = [];
    if (players.length === 0) {
      const e = document.createElement('div'); e.className = 'lanes-empty';
      e.textContent = '참가자를 추가하면 출발선에 말이 섭니다.';
      lanesEl.appendChild(e);
      pos = []; doneAt = []; laneW = 0; hw = 0;
      return;
    }
    players.forEach((p, i) => {
      const lane = document.createElement('div'); lane.className = 'lane';
      const badge = document.createElement('span'); badge.className = 'numbadge';
      badge.style.background = p.color; badge.style.color = textOn(p.color); badge.textContent = i + 1;
      const tag = document.createElement('div'); tag.className = 'tag';
      tag.style.background = p.color; tag.style.color = textOn(p.color);
      const nm = document.createElement('span'); nm.textContent = p.name; tag.appendChild(nm);
      const rkEl = document.createElement('b'); rkEl.className = 'rk'; rkEl.textContent = '1위'; tag.appendChild(rkEl);
      const horse = document.createElement('div'); horse.className = 'horse'; horse.style.color = p.color;
      horse.innerHTML = flameSVG() + horseSVG(i + 1);
      lane.append(badge, tag, horse);
      lanesEl.appendChild(lane);
      laneEls.push(lane); horseEls.push(horse); tagEls.push(tag); badgeEls.push(badge);
    });
    fxCanvas = document.createElement('canvas'); fxCanvas.className = 'fx'; fxCanvas.setAttribute('aria-hidden', 'true');
    lanesEl.insertBefore(fxCanvas, lanesEl.firstChild);
    pos = players.map(() => 0);
    doneAt = players.map(() => null);
    finRank = players.map(() => null);
    measure();
    applyPos(0);
  }

  /* 전체 화면 모드: 시작하면 LIVE+경주로를 화면 가득, 끝나면 원래 크기 */
  let isFull = false;
  let celebTimer = 0;
  /* 큰 PC 모니터 판별: 마우스(정밀 포인터+호버)를 쓰고 화면 너비 1280px·높이 800px 이상.
     터치 기기(스마트폰·태블릿)는 해당하지 않으므로 기존 동작 그대로 */
  const isBigScreen = () => {
    try {
      return matchMedia('(hover: hover) and (pointer: fine)').matches &&
        window.innerWidth >= 1280 && window.innerHeight >= 800;
    } catch (e) { return false; }
  };
  /* 세로 화면이면 경주장을 시계방향 90도 회전해 가로 모드처럼 보여줌.
     폰을 실제로 가로로 돌리면 회전을 풀고 그대로 가로 화면을 사용 */
  function fitRot() {
    if (!isFull) return;
    const W = window.innerWidth, H = window.innerHeight;
    const rot = H > W;
    arenaEl.classList.toggle('rot', rot);
    if (rot) {
      arenaEl.style.width = H + 'px';
      arenaEl.style.height = W + 'px';
      arenaEl.style.left = W + 'px';
    } else {
      ['width', 'height', 'left'].forEach(v => arenaEl.style.removeProperty(v));
    }
    /* 회전했거나 실제 가로 화면이면 가로용 압축 배치 사용 */
    const landscape = rot || W > H;
    arenaEl.classList.toggle('landscape', landscape);
    arenaEl.classList.toggle('big', isBigScreen() && !rot);
    arenaEl.classList.toggle('wide', landscape || players.length <= 4);
    /* 배경 띠 높이: 경주장 높이의 약 11% */
    const ah = rot ? W : H;
    arenaEl.style.setProperty('--scn', clamp(Math.round(ah * 0.11), 26, 110) + 'px');
  }
  function fitLanes() {
    if (!isFull || !players.length) return;
    const landscape = arenaEl.classList.contains('landscape');
    if (landscape) {
      /* 참가 인원에 따라 레인 높이를 재계산합니다.
         적은 인원은 말을 크게, 8명은 화면 안에 모두 들어오도록 자동 축소합니다. */
      const available = Math.max(160, stageEl.clientHeight - 8);
      if (arenaEl.classList.contains('big')) {
        /* 큰 PC 모니터: 레인이 경주장 높이를 위아래 꽉 채우도록 나누고, 말은 너무 커지지 않게 상한을 둠 */
        const lh = Math.max(60, Math.floor(available / players.length));
        arenaEl.style.setProperty('--lh', lh + 'px');
        arenaEl.style.setProperty('--hw', clamp(lh * 1.0, 70, 240) + 'px');
        arenaEl.style.setProperty('--th', clamp(lh * 0.22, 22, 40) + 'px');
        return;
      }
      const lh = clamp(Math.floor(available / players.length), 22, 104);
      arenaEl.style.setProperty('--lh', lh + 'px');
      arenaEl.style.setProperty('--hw', clamp(lh * 1.18, 26, 116) + 'px');
      arenaEl.style.setProperty('--th', clamp(lh * 0.56, 13, 30) + 'px');
      return;
    }
    /* 세로 화면에서도 참가 인원에 맞춰 말 크기를 자동 조절합니다. */
    const inner = Math.max(180, stageEl.clientHeight - 12);
    const lh = clamp(Math.floor(inner / players.length), 48, 170);
    arenaEl.style.setProperty('--lh', lh + 'px');
    arenaEl.style.setProperty('--hw', clamp(lh * 1.08, 48, 184) + 'px');
    arenaEl.style.setProperty('--th', clamp(lh * 0.24, 22, 30) + 'px');
  }
  function enterFull() {
    if (isFull) return;
    slotEl.style.height = arenaEl.offsetHeight + 'px';
    isFull = true;
    arenaEl.classList.add('full');
    /* 회전된 요소는 전체화면 대상이 될 수 없으므로 문서 전체를 전체화면으로 (막히면 화면 가득 채우기만 적용) */
    try {
      const de = document.documentElement;
      if (de.requestFullscreen) de.requestFullscreen().catch(() => {});
    } catch (e) { /* 전체화면 API 미지원 */ }
    fitRot();
    fitLanes();
  }
  function exitFull() {
    if (!isFull) return;
    isFull = false;
    clearTimeout(celebTimer);
    arenaEl.classList.remove('full', 'wide', 'landscape', 'rot', 'big');
    ['--lh', '--hw', '--th', '--scn', 'width', 'height', 'left'].forEach(v => arenaEl.style.removeProperty(v));
    slotEl.style.height = '';
    /* 줄어든 경주장 박스를 브라우저 화면 세로 중간에 맞춤 (전체화면 해제가 끝난 뒤 한 번 더) */
    const center = () => { try { arenaEl.scrollIntoView({ block: 'center', inline: 'nearest' }); } catch (e) { /* 무시 */ } };
    requestAnimationFrame(() => { fitWinner(); center(); });
    setTimeout(() => { fitWinner(); measure(); applyPos(lastT); center(); }, 300);
    try { if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {}); } catch (e) { /* 무시 */ }
  }

  /* 경마장 아나운서 멘트: 선두 진행도와 선두 교체에 맞춰 LIVE 바에 표시 */
  let cm = { text: '', t: -9, phase: -1, lead: -1, k: 0 }, midName = null;
  const iga = n => { const c = n.charCodeAt(n.length - 1); return (c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28 !== 0) ? '이' : '가'; };
  const LINES = [
    [() => '출발했습니다! 일제히 박차고 나갑니다!', n => n + ', 좋은 스타트로 앞서 나갑니다!'],
    [n => n + iga(n) + ' 선두, 그 뒤를 바짝 쫓고 있습니다!', () => '안쪽에서 치고 올라옵니다!'],
    [() => '마지막 직선 코스! 승부가 갈립니다!', n => n + iga(n) + ' 선두, 그 뒤를 바짝 쫓고 있습니다!'],
    [() => '결승선이 코앞입니다! 누가 먼저 들어올까요!', () => '마지막 직선 코스! 승부가 갈립니다!']
  ];
  function commentary(t) {
    if (!players.length) return;
    let lead = 0;
    const fin = finRank.map((r, i) => r != null ? i : -1).filter(i => i >= 0).sort((a, b) => finRank[a] - finRank[b]);
    if (fin.length) lead = fin[0];
    else for (let i = 1; i < pos.length; i++) if (pos[i] > pos[lead]) lead = i;
    const u = pos[lead];
    const phase = u < 0.15 ? 0 : u < 0.6 ? 1 : u < 0.85 ? 2 : 3;
    const n = players[lead].name;
    if (phase >= 2 && midName === null) midName = n;
    /* 폭주 중계 멘트는 잠시 유지 */
    if (cm.hold && t < cm.hold) { cm.lead = lead; cm.phase = phase; return; }
    const changed = cm.lead >= 0 && lead !== cm.lead && u > 0.15 && u < 0.95;
    let text = null;
    if (changed) {
      if (t - cm.t >= 0.8) text = phase >= 2 ? n + ', 막판 스퍼트! 선두가 바뀝니다!' : '순위가 뒤집힙니다! 아직 아무도 몰라요!';
    } else if (phase !== cm.phase || t - cm.t >= 1.8) {
      const L = LINES[phase]; text = L[cm.k++ % L.length](n);
    }
    cm.lead = lead; cm.phase = phase;
    if (text && text !== cm.text) {
      cm.text = text; cm.t = t;
      putStatus('🎙️ ' + text);
    }
  }

  function resetRace() {
    cancelAnimationFrame(raf);
    clearTimeout(celebTimer);
    musicStop();
    stopConfetti();
    racing = false; hasRaced = false; finished = []; lastT = 0;
    resultsEl.textContent = '';
    emptyEl.hidden = false;
    clockEl.textContent = '0.0초';
    buildLanes();
    updateControls();
    setStatus();
  }

  function addResult(rank, p, time) {
    const li = document.createElement('li'); li.className = 'res r' + Math.min(rank, 4);
    const rk = document.createElement('span'); rk.className = 'rankpill';
    rk.textContent = (MEDAL[rank - 1] ? MEDAL[rank - 1] + ' ' : '') + rank + '위';
    const dot = document.createElement('span'); dot.className = 'dot'; dot.style.background = p.color;
    const nm = document.createElement('span'); nm.className = 'rname'; nm.textContent = p.name;
    const tm = document.createElement('span'); tm.className = 'rtime'; tm.textContent = time.toFixed(2) + '초';
    li.append(rk, dot, nm, tm);
    resultsEl.appendChild(li);
    emptyEl.hidden = true;
  }

  function finishHorse(i, T) {
    const rank = finished.length + 1;
    finished.push({ name: players[i].name, color: players[i].color, time: T, no: i + 1 });
    doneAt[i] = lastT;
    finRank[i] = rank;
    try { horseEls[i].getAnimations({ subtree: true }).forEach(a => { a.playbackRate = 0.35; }); } catch (e) { /* 미지원 브라우저는 그대로 */ }
    tagEls[i].classList.add('done');
    if (rank === 1) tagEls[i].classList.add('first');
    tagW[i] = tagEls[i].offsetWidth;
    addResult(rank, players[i], T);
    sfx.cross(rank);
  }

  /* 경주가 끝나면 다리 움직임을 서서히 늦춰 멈춤 */
  function settleLegs() {
    let anims = [];
    try { anims = horseEls.flatMap(h => h.getAnimations({ subtree: true })); } catch (e) { return; }
    let r = 0.35;
    const slow = () => {
      r *= 0.9;
      if (r > 0.02) { anims.forEach(a => { a.playbackRate = r; }); requestAnimationFrame(slow); }
      else anims.forEach(a => a.pause());
    };
    slow();
  }

  /* 말 뒤쪽 번호판: 경주 중에는 현재 순위, 결승선을 지난 말은 확정 순위 */
  function updateRanks() {
    /* 동률이면 같은 순위: 출발 전 카운트다운 동안에는 모든 말이 1위 */
    const finCount = finRank.filter(r => r != null).length;
    const rankOf = i => finRank[i] != null
      ? finRank[i]
      : finCount + 1 + pos.filter((v, j) => finRank[j] == null && v > pos[i]).length;
    pos.forEach((_, i) => {
      const r = rankOf(i), t = String(r);
      const el = badgeEls[i];
      if (el && el.textContent !== t) {
        el.textContent = t;
        el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
      }
      const rk = tagEls[i] && tagEls[i].querySelector('.rk');
      if (rk && rk.textContent !== t + '위') { rk.textContent = t + '위'; tagW[i] = tagEls[i].offsetWidth; }
    });
  }

  function runRace() {
    if (racing || players.length < MIN) return;
    setMsg('');
    finished = []; pfSnap = null;
    resultsEl.textContent = '';
    emptyEl.hidden = false;
    buildLanes();
    sfx.start();

    const n = players.length;
    const order = shuffle([...Array(n).keys()]);
    const step = Math.min(0.17, 1.2 / n);
    const k = getDur() / 10;
    const race = players.map((p, i) => ({
      T: (9.6 + order[i] * step + Math.random() * step * 0.35) * k,
      waves: [
        { a: 0.035, f: 1 + Math.random(), ph: Math.random() * 6.283 },
        { a: 0.020, f: 2 + Math.random(), ph: Math.random() * 6.283 },
        { a: 0.010, f: 3 + Math.random(), ph: Math.random() * 6.283 }
      ],
      c: 0, fin: 0, last: 0, done: false
    }));
    const maxT = Math.max(...race.map(r => r.T));
    /* 폭주: 선두가 중반(50~70% 지점 중 무작위)을 넘으면, 그 순간 1~3위를 뺀 말 중 하나가
       경주 길이별 시간(10초 1.5초, 15초 2.3초, 20초 3초) 동안 1.2배 속도로 달림. 참가자가 4명 이상일 때만 발생 */
    const BOOST_MUL = 1.2, BOOST_SEC = ({ 10: 1.5, 15: 2.3, 20: 3 })[getDur()] || 1.5;
    const boostAt = 0.5 + Math.random() * 0.2;
    let boost = null, boostTried = !darkHorse || n < 4;
    const setBoostFx = (i, on) => {
      horseEls[i].classList.toggle('boost', on);
      if (on && !ghostImg[i]) ghostImg[i] = makeGhost(players[i].color, i + 1);
      try { horseEls[i].getAnimations({ subtree: true }).forEach(a => { if (!race[i].done) a.playbackRate = on ? BOOST_MUL : 1; }); } catch (e) { /* 미지원 브라우저는 그대로 */ }
    };
    musicStart(maxT + 2); /* 막판 슬로모션만큼 여유 */

    cm = { text: '', t: -9, phase: -1, lead: -1, k: 0 }; midName = null;
    racing = true; hasRaced = true;
    renderRoster(); updateControls(); setStatus();
    laneEls.forEach(l => l.classList.add('running'));

    /* 막판 슬로모션과 줌: 선두가 결승선 직전(95%)에 오면 경주 시간이 0.4배로 느려지고 화면이 선두 쪽으로 당겨짐.
       1위가 들어온 뒤 0.3초가 지나면(실제 시간 최대 1.6초) 원래 속도로 돌아옴 */
    const SLOW_RATE = 0.4, SLOW_FROM = 0.95, SLOW_AFTER = 0.3, SLOW_MAX = 1.6, ZOOM_MAX = 1.2;
    let lastNow = performance.now(), simT = 0, rate = 1, slowReal = 0, zoom = 1, zx = 0, zy = 0;
    scX = 0; ghostClock = 0;
    const frame = now => {
      const realDt = Math.min(0.05, Math.max(0, (now - lastNow) / 1000)); lastNow = now;
      const leadPos = Math.max(...pos);
      const wantSlow = !RM && slowReal < SLOW_MAX &&
        (finished.length ? simT - finished[0].time < SLOW_AFTER : leadPos >= SLOW_FROM);
      if (wantSlow) slowReal += realDt;
      rate += ((wantSlow ? SLOW_RATE : 1) - rate) * Math.min(1, realDt * 10);
      stageEl.classList.toggle('slow', wantSlow);
      simT += realDt * rate;
      const t = simT;
      const prevT = lastT, dt = Math.max(0, t - prevT);
      lastT = t;
      const before = pos.slice();
      const just = [];
      race.forEach((r, i) => {
        if (!r.done) {
          /* 각 말의 진행 시계: 폭주 구간과 겹친 시간만큼 1.2배로 흐름 */
          let adv = dt;
          if (boost && boost.i === i) adv += (BOOST_MUL - 1) * Math.max(0, Math.min(t, boost.t1) - Math.max(prevT, boost.t0));
          if (r.c + adv >= r.T) r.fin = adv > 0 ? prevT + (r.T - r.c) * dt / adv : t;
          r.c = Math.min(r.T, r.c + adv);
        }
        const u = r.c / r.T;
        let p = 1;
        if (u < 1) {
          let w = 0;
          r.waves.forEach(wv => { w += wv.a * Math.sin(2 * Math.PI * wv.f * u + wv.ph); });
          p = Math.min(0.999, Math.max(r.last, u + Math.sin(Math.PI * u) * w));
        } else if (!r.done) {
          r.done = true; just.push(i);
        }
        r.last = p; pos[i] = p;
      });
      just.sort((a, b) => race[a].fin - race[b].fin).forEach(i => finishHorse(i, race[i].fin));
      if (boost && boost.on && (t >= boost.t1 || race[boost.i].done)) { boost.on = false; horseEls[boost.i].classList.remove('boost'); }
      if (!boostTried && Math.max(...pos) >= boostAt) {
        boostTried = true;
        const pick = [...Array(n).keys()].filter(i => !race[i].done).sort((a, b) => pos[b] - pos[a]).slice(3);
        if (pick.length) {
          const i = pick[Math.floor(Math.random() * pick.length)];
          boost = { i, t0: t, t1: t + BOOST_SEC, on: true };
          setBoostFx(i, true);
          const txt = '🔥 ' + players[i].name + ', 폭주합니다! 무서운 속도로 치고 나갑니다!';
          cm.text = txt; cm.t = t; cm.hold = t + 1.3; putStatus('🎙️ ' + txt);
        }
      }
      if (boost && !boost.on && !boost.cleared) { boost.cleared = true; if (!race[boost.i].done) setBoostFx(boost.i, false); }
      if (!pfSnap && finished.length) pfSnap = { pos: pos.slice(), track: laneW - hw, hw };
      updateRanks();
      commentary(t);
      applyPos(t);
      if (!RM) {
        const track = laneW - hw;
        race.forEach((r, i) => { if (!r.done) spawnFx(i, Math.max(0, pos[i] - before[i]) * track, !!(boost && boost.on && boost.i === i), dt); });
        fxStep(dt);
        scrollScenery(dt, 1 - 0.8 * finished.length / n);
        /* 줌 중심: 1위가 들어왔으면 1위 말, 아니면 지금 선두 */
        let li = 0;
        if (finished.length) li = finished[0].no - 1;
        else for (let i = 1; i < pos.length; i++) if (pos[i] > pos[li]) li = i;
        const g = geo[li];
        if (g) {
          const tx = g.ox + pos[li] * track + hw * 0.6, ty = g.oy + g.hh * 0.5;
          if (zoom < 1.004) { zx = tx; zy = ty; }
          else { const e = Math.min(1, realDt * 8); zx += (tx - zx) * e; zy += (ty - zy) * e; }
        }
        zoom += ((wantSlow ? ZOOM_MAX : 1) - zoom) * Math.min(1, realDt * 6);
        if (zoom > 1.004) {
          lanesEl.style.transformOrigin = zx.toFixed(1) + 'px ' + zy.toFixed(1) + 'px';
          lanesEl.style.transform = 'scale(' + zoom.toFixed(4) + ')';
        } else if (lanesEl.style.transform) resetCam();
      }
      /* 1위가 결승선을 통과하면 초시계를 1위 기록에서 멈춤 (순위표와 같은 소수 둘째 자리) */
      clockEl.textContent = finished.length ? finished[0].time.toFixed(2) + '초' : t.toFixed(1) + '초';

      if (finished.length === n && t > maxT + 0.5) {
        racing = false;
        resetCam();
        fxTail();
        clockEl.textContent = finished[0].time.toFixed(2) + '초';
        renderRoster(); updateControls(); setStatus();
        measure(); applyPos(lastT);
        settleLegs();
        musicStop();
        /* 결승 후 폭죽이 끝날 때까지 가로 전체화면을 유지한 뒤 원래 세로 방향으로 복귀 */
        setTimeout(() => { sfx.end(); fireConfetti(); }, 150);
        celebTimer = setTimeout(() => exitFull(), 3150); /* 폭죽(150ms 후 발사) 뒤 3초 대기 */
        return;
      }
      raf = requestAnimationFrame(frame);
    };
    raf = requestAnimationFrame(frame);
  }

  /* 축포: 경주로 양쪽 아래에서 색종이가 터져 올라감 (3번 연속) */
  let confRaf = 0, confTimers = [];
  function stopConfetti() {
    cancelAnimationFrame(confRaf); confRaf = 0;
    confTimers.forEach(clearTimeout); confTimers = [];
    const c = confettiEl.getContext('2d');
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.clearRect(0, 0, confettiEl.width, confettiEl.height);
  }
  function fireConfetti() {
    stopConfetti();
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const W = stageEl.clientWidth, H = stageEl.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!W || !H) return;
    confettiEl.width = Math.round(W * dpr); confettiEl.height = Math.round(H * dpr);
    const c = confettiEl.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const COLORS = ['#FF4D4D', '#FFC62F', '#2F7DF0', '#18A957', '#E8579A', '#8E44C9', '#12B5C9', '#FFFFFF'];
    const G = 900, v0 = Math.sqrt(2 * G * H * 0.95), parts = [];
    const shoot = (x, ang, n) => {
      for (let i = 0; i < n; i++) {
        const a = ang + (Math.random() - 0.5) * 0.8, s = v0 * (0.5 + Math.random() * 0.55);
        parts.push({
          x, y: H, vx: Math.cos(a) * s * 0.7, vy: Math.sin(a) * s,
          w: 6 + Math.random() * 6, h: 4 + Math.random() * 6,
          rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 12,
          c: COLORS[Math.floor(Math.random() * COLORS.length)],
          age: 0, max: 2.4 + Math.random() * 1.2
        });
      }
    };
    [0, 0.45, 0.9].forEach(dt => confTimers.push(setTimeout(() => {
      shoot(8, -Math.PI / 3, 55);
      shoot(W - 8, -2 * Math.PI / 3, 55);
      if (dt > 0) sfx.pop();
    }, dt * 1000)));
    const t0 = performance.now();
    let last = t0;
    const step = now => {
      const dt = Math.min(0.04, (now - last) / 1000); last = now;
      c.clearRect(0, 0, W, H);
      let alive = 0;
      parts.forEach(p => {
        p.age += dt;
        if (p.age >= p.max) return;
        alive++;
        p.vy += G * dt; p.vx *= 0.992; p.vy *= 0.992;
        p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
        const hh = p.h * Math.abs(Math.cos(p.rot * 1.7)) + 1;
        c.save();
        c.globalAlpha = Math.min(1, (p.max - p.age) / 0.5);
        c.translate(p.x, p.y); c.rotate(p.rot);
        c.fillStyle = p.c;
        c.fillRect(-p.w / 2, -hh / 2, p.w, hh);
        c.restore();
      });
      if (alive || now - t0 < 1300) confRaf = requestAnimationFrame(step); else stopConfetti();
    };
    confRaf = requestAnimationFrame(step);
  }

  /* 시작 버튼 자리에 3, 2, 1, 출발 순서로 카운트다운을 보여주고 출발과 함께 총성 */
  function showCount(txt, go) {
    cdEl.textContent = '';
    const s = document.createElement('span');
    if (go) s.className = 'go';
    s.textContent = txt;
    cdEl.appendChild(s);
    cdEl.hidden = false;
  }
  function hideCount() { cdEl.hidden = true; cdEl.textContent = ''; }

  function beginCountdown() {
    if (racing || counting || players.length < MIN) return;
    setMsg('');
    finished = [];
    resultsEl.textContent = '';
    emptyEl.hidden = false;
    clockEl.textContent = '0.0초';
    stopConfetti();
    enterFull();
    buildLanes();
    updateRanks();
    counting = true;
    updateControls(); setStatus();
    const tick = n => {
      showCount(String(n)); sfx.tick();
      if (n === 1) { putStatus('🎙️ 숨 막히는 정적, 곧 출발합니다!'); }
    };
    tick(3);
    setTimeout(() => tick(2), 1000);
    setTimeout(() => tick(1), 2000);
    setTimeout(() => {
      counting = false;
      showCount('출발', true);
      runRace();
      setTimeout(hideCount, 900);
    }, 3000);
  }

  function removePlayer(id) {
    if (racing || counting) return;
    players = players.filter(p => p.id !== id);
    setMsg('');
    renderRoster(); resetRace();
  }

  /* 이름 추가. 클로드 미리보기 같은 샌드박스 화면에서는 form 제출(submit)이 막혀 있어서
     추가 버튼 클릭과 Enter 키를 직접 처리합니다. */
  let lastAddAt = 0, pendingEnter = false;

  /* 이름 길이 제한: 한글은 3글자, 알파벳(숫자·기호 포함)은 6글자까지.
     한글 1글자 = 2칸, 그 밖의 글자 = 1칸으로 세어 최대 6칸 (예: 한글 2자 + 영문 2자) */
  const NAME_UNITS = 6;
  const isHangul = ch => /[ᄀ-ᇿ㄰-㆏가-힣]/.test(ch);
  function clipName(str) {
    let units = 0, out = '';
    for (const ch of Array.from(str)) {
      const w = isHangul(ch) ? 2 : 1;
      if (units + w > NAME_UNITS) return { text: out, cut: true };
      units += w; out += ch;
    }
    return { text: out, cut: false };
  }
  function enforceNameLimit() {
    const r = clipName(input.value);
    if (r.cut) {
      input.value = r.text;
      setMsg('이름은 한글 3글자, 영문 6글자까지 입력할 수 있어요.');
    }
  }
  input.addEventListener('input', e => {
    /* 한글 조합 중에는 자르지 않고, 조합이 끝난 뒤에 자름 */
    if (e.isComposing) return;
    enforceNameLimit();
  });
  input.addEventListener('compositionend', () => setTimeout(enforceNameLimit, 0));

  function tryAdd() {
    if (racing || counting) return;
    const name = clipName(input.value.trim().replace(/\s+/g, ' ')).text.trim();
    if (!name) {
      /* 한글 입력 중 Enter가 두 번 들어오는 브라우저: 방금 추가했으면 조용히 넘어감 */
      if (Date.now() - lastAddAt < 400) return;
      setMsg('이름을 입력해 주세요.'); input.focus(); return;
    }
    if (players.length >= MAX) { setMsg('최대 ' + MAX + '명까지 참가할 수 있어요.'); input.focus(); return; }
    if (players.some(p => p.name.toLowerCase() === name.toLowerCase())) { setMsg('이미 있는 이름이에요.'); input.focus(); return; }
    setMsg('');
    addPlayer(name);
    lastAddAt = Date.now();
    sfx.add();
    input.value = '';
    renderRoster(); resetRace();
    if (!input.disabled) input.focus();
  }
  form.addEventListener('submit', e => { e.preventDefault(); tryAdd(); });
  addBtn.addEventListener('click', tryAdd);
  input.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    /* 한글 조합 중 Enter: 조합이 끝난 뒤에 추가 */
    if (e.isComposing || e.keyCode === 229) { pendingEnter = true; return; }
    e.preventDefault();
    tryAdd();
  });
  input.addEventListener('compositionend', () => {
    if (!pendingEnter) return;
    pendingEnter = false;
    setTimeout(() => { if (input.value.trim()) tryAdd(); }, 0);
  });

  resetBtn.addEventListener('click', () => {
    if (racing || counting) return;
    players = []; nextId = 1; setMsg('');
    input.value = '';
    renderRoster(); resetRace();
    input.focus();
  });

  /* 경주마 추가: 누를 때마다 두 글자 경주마 이름을 무작위로 한 명씩 추가, 8명이면 비활성화 */
  sampleBtn.addEventListener('click', () => {
    if (racing || counting || players.length >= MAX) return;
    const free = SAMPLES.filter(n => !players.some(p => p.name === n));
    if (!free.length) return;
    setMsg('');
    addPlayer(free[Math.floor(Math.random() * free.length)]);
    sfx.add();
    renderRoster(); resetRace();
  });

  soundBtn.addEventListener('click', () => {
    soundOn = !soundOn;
    soundBtn.setAttribute('aria-pressed', String(soundOn));
    soundBtn.textContent = soundOn ? '🔊 효과음 켜짐' : '🔇 효과음 꺼짐';
    if (soundOn) sfx.add(); else musicStop();
  });

  durInputs.forEach(i => i.addEventListener('change', () => { updateHead(); updateControls(); }));
  startBtn.addEventListener('click', beginCountdown);
  dhBtn.addEventListener('click', () => {
    darkHorse = !darkHorse;
    dhBtn.setAttribute('aria-pressed', String(darkHorse));
    dhBtn.textContent = darkHorse ? '🔥 다크호스 모드 켜짐' : '🐴 다크호스 모드 꺼짐';
    sfx.add();
  });

  const remeasure = () => {
    fitRot(); fitLanes(); measure(); applyPos(lastT); fitWinner();
  };
  if (window.ResizeObserver) { const ro = new ResizeObserver(remeasure); ro.observe(lanesEl); ro.observe(stageEl); }
  window.addEventListener('resize', remeasure);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { measure(); applyPos(lastT); });

  updateHead();
  renderRoster();
  resetRace();
})();
</script>

</body></html>
